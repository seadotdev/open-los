        content:
          application/yaml: {}
      responses:
        "200":
          description: Updated

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: apiKey
      description: UUID token from an API Consumer
    BasicAuth:
      type: http
      scheme: basic
      description: Mambu UI username and password

  parameters:
    OffsetParam:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
      description: Pagination offset
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 1000
      description: Pagination limit
    PaginationDetailsParam:
      name: paginationDetails
      in: query
      schema:
        type: string
        enum: ["ON", "OFF"]
        default: "OFF"
      description: Whether to include total count in response
    DetailsLevelParam:
      name: detailsLevel
      in: query
      schema:
        type: string
        enum: ["BASIC", "FULL"]
        default: "BASIC"
      description: Level of detail in response
    SortByParam:
      name: sortBy
      in: query
      schema:
        type: string
      description: "Field and order, e.g. creationDate:ASC"

  schemas:
    # ── Error ──
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              errorCode:
                type: integer
              errorSource:
                type: string
              errorReason:
                type: string

    # ── Patch Operation ──
    PatchOperation:
      type: object
      required: [op, path, value]
      properties:
        op:
          type: string
          enum: [ADD, REPLACE, REMOVE, MOVE]
        path:
          type: string
        from:
          type: string
        value: {}

    # ── Search ──
    SearchCriteria:
      type: object
      properties:
        filterCriteria:
          type: array
          items:
            $ref: "#/components/schemas/FilterCriterion"
        sortingCriteria:
          $ref: "#/components/schemas/SortingCriteria"
    FilterCriterion:
      type: object
      required: [field, operator]
      properties:
        field:
          type: string
        operator:
          type: string
          enum:
            - EQUALS
            - EQUALS_CASE_SENSITIVE
            - DIFFERENT_THAN
            - MORE_THAN
            - LESS_THAN
            - BETWEEN
            - ON
            - AFTER
            - AFTER_INCLUSIVE
            - BEFORE
            - BEFORE_INCLUSIVE
            - STARTS_WITH
            - STARTS_WITH_CASE_SENSITIVE
            - IN
            - TODAY
            - THIS_WEEK
            - THIS_MONTH
            - THIS_YEAR
            - LAST_DAYS
            - EMPTY
            - NOT_EMPTY
        value:
          type: string
        secondValue:
          type: string
          description: Used with BETWEEN operator
        values:
          type: array
          items:
            type: string
          description: Used with IN operator
    SortingCriteria:
      type: object
      properties:
        field:
          type: string
        order:
          type: string
          enum: [ASC, DESC]

    # ── Address ──
    Address:
      type: object
      properties:
        encodedKey:
          type: string
          readOnly: true
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        region:
          type: string
        postcode:
          type: string
        country:
          type: string
        parentKey:
          type: string
        indexInList:
          type: integer

    # ── Identification Document ──
    IdentificationDocument:
      type: object
      properties:
        encodedKey:
          type: string
          readOnly: true
        documentId:
          type: string
        documentType:
          type: string
        identificationDocumentTemplateKey:
          type: string
        issuingAuthority:
          type: string
        validUntil:
          type: string
          format: date
        indexInList:
          type: integer
        attachments:
          type: array
          items:
            type: object
            properties:
              encodedKey:
                type: string
              fileName:
                type: string
              fileSize:
                type: integer
              name:
                type: string
              type:
                type: string

    # ── Currency ──
    Currency:
      type: object
      properties:
        code:
          type: string
          description: ISO 4217 currency code
        name:
          type: string
        symbol:
          type: string
        digitsAfterDecimal:
          type: integer
        currencySymbolPosition:
          type: string
          enum: [BEFORE_NUMBER, AFTER_NUMBER]
        isBaseCurrency:
          type: boolean

    # ── Client ──
    Client:
      type: object
      required: [firstName, lastName]
      properties:
        encodedKey:
          type: string
          readOnly: true
        id:
          type: string
        state:
          type: string
          enum: [PENDING_APPROVAL, INACTIVE, ACTIVE, EXITED, BLACKLISTED, REJECTED]
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        gender:
          type: string
          enum: [MALE, FEMALE]
        birthDate:
          type: string
          format: date
        emailAddress:
          type: string
        mobilePhone:
          type: string
        mobilePhone2:
          type: string
        homePhone:
          type: string
        preferredLanguage:
          type: string
          enum:
            - ENGLISH
            - PORTUGESE
            - SPANISH
            - RUSSIAN
            - FRENCH
            - GEORGIAN
            - CHINESE
            - INDONESIAN
            - ROMANIAN
            - BURMESE
            - GERMAN
            - PORTUGUESE_BRAZIL
            - VIETNAMESE
            - ITALIAN
            - THAI
            - NORWEGIAN
            - PHRASE
        notes:
          type: string
        clientRoleKey:
          type: string
        assignedBranchKey:
          type: string
        assignedCentreKey:
          type: string
        assignedUserKey:
          type: string
        groupKeys:
          type: array
          items:
            type: string
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/Address"
        idDocuments:
          type: array
          items:
            $ref: "#/components/schemas/IdentificationDocument"
        profilePictureKey:
          type: string
        profileSignatureKey:
          type: string
        loanCycle:
          type: integer
          readOnly: true
        groupLoanCycle:
          type: integer
          readOnly: true
        activationDate:
          type: string
          format: date-time
          readOnly: true
        approvedDate:
          type: string
          format: date-time
          readOnly: true
        closedDate:
          type: string
          format: date-time
          readOnly: true
        creationDate:
          type: string
          format: date-time
          readOnly: true
        lastModifiedDate:
          type: string
          format: date-time
          readOnly: true

    # ── Group ──
    Group:
      type: object
      required: [groupName]
      properties:
        encodedKey:
          type: string
          readOnly: true
        id:
          type: string
        groupName:
          type: string
        assignedBranchKey:
          type: string
        assignedCentreKey:
          type: string
        assignedUserKey:
          type: string
        groupRoleKey:
          type: string
        groupMembers:
          type: array
          items:
            type: object
            properties:
              clientKey:
                type: string
              roles:
                type: array
                items:
                  type: object
                  properties:
                    groupRoleNameKey:
                      type: string
                    roleName:
                      type: string
                    roleNameId:
                      type: string
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/Address"
        notes:
          type: string
        emailAddress:
          type: string
        mobilePhone:
          type: string
        preferredLanguage:
          type: string
        loanCycle:
          type: integer
          readOnly: true
        creationDate:
          type: string
          format: date-time
          readOnly: true
        lastModifiedDate:
          type: string
          format: date-time
          readOnly: true

    # ── Branch ──
    Branch:
      type: object
      required: [name]
      properties:
        encodedKey:
          type: string
          readOnly: true
        id:
          type: string
        name:
          type: string
        state:
          type: string
          enum: [ACTIVE, INACTIVE]
        phoneNumber:
          type: string
        emailAddress:
          type: string
        notes:
          type: string
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/Address"
        holidays:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              date:
                type: string
                format: date
              isAnnuallyRecurring:
                type: boolean
        creationDate:
          type: string
          format: date-time
          readOnly: true
        lastModifiedDate:
          type: string
          format: date-time
          readOnly: true

    # ── Centre ──
    Centre:
      type: object
      required: [name]
      properties:
        encodedKey:
          type: string
          readOnly: true
        id:
          type: string
        name:
          type: string
        state:
          type: string
          enum: [ACTIVE, INACTIVE]
        assignedBranchKey:
          type: string
        meetingDay:
          type: string
        notes:
          type: string
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/Address"
        creationDate:
          type: string
          format: date-time
          readOnly: true
        lastModifiedDate:
          type: string
          format: date-time
          readOnly: true

    # ── User ──
    User:
      type: object
      required: [username, firstName, lastName, email]
      properties:
        encodedKey:
          type: string
          readOnly: true
        id:
          type: string
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        userState:
          type: string
          enum: [ACTIVE, INACTIVE, LOCKED]
        language:
          type: string
        role:
          type: object
          properties:
            encodedKey:
              type: string
            id:
              type: string
        title:
          type: string
        mobilePhone:
          type: string
        homePhone:
          type: string
        notes:
          type: string
        access:
          $ref: "#/components/schemas/UserAccess"
        creationDate:
          type: string
          format: date-time
          readOnly: true
        lastModifiedDate:
          type: string
          format: date-time
          readOnly: true
    UserAccess:
      type: object
      properties:
        mambuAccess:
          type: boolean
        apiAccess:
          type: boolean
        administratorAccess:
          type: boolean
        creditOfficerAccess:
          type: boolean
        tellerAccess:
          type: boolean
        supportAccess:
          type: boolean
        canManageAllBranches:
          type: boolean
        canManageEntitiesAssignedToOtherOfficers:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        managedBranches:
          type: array
          items:
            type: object
            properties:
              branchKey:
                type: string

    # ── Loan Account ──
    LoanAccount:
      type: object
      required: [loanAmount, productTypeKey, accountHolderKey, accountHolderType]
      properties:
        encodedKey:
          type: string
          readOnly: true
        id:
          type: string
        loanName:
          type: string
        loanAmount:
          type: number
        productTypeKey:
          type: string
        accountHolderKey:
          type: string
        accountHolderType:
          type: string
          enum: [CLIENT, GROUP]
        accountState:
          type: string
          enum:
            - PARTIAL_APPLICATION
            - PENDING_APPROVAL
            - APPROVED
            - ACTIVE
            - ACTIVE_IN_ARREARS
            - CLOSED
            - CLOSED_WRITTEN_OFF
            - CLOSED_REJECTED
        accountSubState:
          type: string
          enum:
            - PARTIALLY_DISBURSED
            - LOCKED
            - LOCKED_CAPPING
            - REFINANCED
            - RESCHEDULED
            - WITHDRAWN
            - REPAID
            - REJECTED
            - WRITTEN_OFF
            - TERMINATED
        assignedBranchKey:
          type: string
        assignedCentreKey:
          type: string
        assignedUserKey:
          type: string
        creditArrangementKey:
          type: string
        currencyCode:
          type: string
        scheduleSettings:
          $ref: "#/components/schemas/LoanScheduleSettings"
        interestSettings:
          $ref: "#/components/schemas/LoanInterestSettings"
        penaltySettings:
          $ref: "#/components/schemas/LoanPenaltySettings"
        prepaymentSettings:
          $ref: "#/components/schemas/LoanPrepaymentSettings"
        principalPaymentSettings:
          $ref: "#/components/schemas/PrincipalPaymentSettings"
        disbursementDetails:
          $ref: "#/components/schemas/DisbursementDetails"
        balances:
          $ref: "#/components/schemas/LoanBalances"
          readOnly: true
        feesSettings:
          $ref: "#/components/schemas/FeesAccountSettings"
        accountArrearsSettings:
          $ref: "#/components/schemas/AccountArrearsSettings"
        redrawSettings:
          $ref: "#/components/schemas/RedrawSettings"
        guarantors:
          type: array
          items:
            $ref: "#/components/schemas/Guarantor"
        assets:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        fundingSources:
          type: array
          items:
            $ref: "#/components/schemas/InvestorFund"
        tranches:
          type: array
          items:
            $ref: "#/components/schemas/LoanTranche"
        plannedInstallmentFees:
          type: array
          items:
            $ref: "#/components/schemas/PlannedInstallmentFee"
        futurePaymentsAcceptance:
          type: string
          enum: [NO_FUTURE_PAYMENTS, ACCEPT_FUTURE_PAYMENTS, ACCEPT_OVERPAYMENTS]
        paymentMethod:
          type: string
          enum: [HORIZONTAL, VERTICAL]
        latePaymentsRecalculationMethod:
          type: string
          enum: [OVERDUE_INSTALLMENTS_INCREASE, LAST_INSTALLMENT_INCREASE, NO_RECALCULATION]
        lockedOperations:
          type: array
          items:
            type: string
            enum: [APPLY_INTEREST, APPLY_FEES, APPLY_PENALTIES]
        notes:
          type: string
        migrationEventKey:
          type: string
        activationTransactionKey:
          type: string
          readOnly: true
        lineOfCreditKey:
          type: string
        settingsKey:
          type: string
        accrueInterestAfterMaturity:
          type: boolean
        accrueLateInterest:
          type: boolean
        taxRate:
          type: number
        approvedDate:
          type: string
          format: date-time
          readOnly: true
        closedDate:
          type: string
          format: date-time
          readOnly: true
        creationDate:
          type: string
          format: date-time
          readOnly: true
        lastModifiedDate:
          type: string
          format: date-time
          readOnly: true
      additionalProperties: true

    LoanScheduleSettings:
      type: object
      properties:
        repaymentInstallments:
          type: integer
        repaymentPeriodCount:
          type: integer
        repaymentPeriodUnit:
          type: string
          enum: [DAYS, WEEKS, MONTHS, YEARS]
        repaymentScheduleMethod:
          type: string
          enum: [NONE, FIXED, DYNAMIC]
        scheduleDueDatesMethod:
          type: string
          enum: [INTERVAL, FIXED_DAYS_OF_MONTH]
        fixedDaysOfMonth:
          type: array
          items:
            type: integer
        shortMonthHandlingMethod:
          type: string
          enum: [LAST_DAY_IN_MONTH, FIRST_DAY_OF_NEXT_MONTH]
        gracePeriod:
          type: integer
        gracePeriodType:
          type: string
          enum: [NONE, PAY_INTEREST_ONLY, INTEREST_FORGIVENESS]
        amortizationMethod:
          type: string
          enum: [STANDARD_PAYMENTS, BALLOON_PAYMENTS, OPTIMIZED_PAYMENTS, PAYMENT_PLAN]
        repaymentReschedulingMethod:
          type: string
          enum: [NONE, NEXT_WORKING_DAY, PREVIOUS_WORKING_DAY, EXTEND_SCHEDULE]
        principalRoundingSettings:
          type: object
          properties:
            roundingRepaymentCurrencyDigits:
              type: string
        hasCustomSchedule:
          type: boolean
        periodicPayment:
          type: number
        paymentPlan:
          type: array
          items:
            type: object
            properties:
              amount:
                type: number
              toInstallment:
                type: integer
        firstRepaymentDate:
          type: string
          format: date

    LoanInterestSettings:
      type: object
      properties:
        interestRate:
          type: number
        interestSpread:
          type: number
        interestRateSource:
          type: string
          enum: [FIXED_INTEREST_RATE, INDEX_INTEREST_RATE]
        interestRateTerms:
          type: string
          enum: [FIXED, TIERED, TIERED_PERIOD, TIERED_BAND]
        interestChargeFrequency:
          type: string
          enum: [ANNUALIZED, EVERY_MONTH, EVERY_FOUR_WEEKS, EVERY_WEEK, EVERY_DAY, EVERY_X_DAYS]
        interestChargeFrequencyCount:
          type: integer
        interestCalculationMethod:
          type: string
          enum: [FLAT, DECLINING_BALANCE, DECLINING_BALANCE_DISCOUNTED, EQUAL_INSTALLMENTS]
        interestType:
          type: string
          enum: [SIMPLE_INTEREST, CAPITALIZED_INTEREST, COMPOUNDING_INTEREST]
        interestApplicationMethod:
          type: string
          enum: [AFTER_DISBURSEMENT, REPAYMENT_DUE_DATE, FIXED_DAYS_OF_MONTH]
        interestBalanceCalculationMethod:
          type: string
          enum: [ONLY_PRINCIPAL, PRINCIPAL_AND_INTEREST, PRINCIPAL_AND_FEE, PRINCIPAL_INTEREST_AND_FEE]
        interestRateReviewUnit:
          type: string
          enum: [DAYS, WEEKS, MONTHS]
        interestRateReviewCount:
          type: integer
        interestFloorValue:
          type: number
        interestCeilingValue:
          type: number
        indexRateSourceKey:
          type: string
        accrueInterestAfterMaturity:
          type: boolean
        accrueLateInterest:
          type: boolean

    LoanPenaltySettings:
      type: object
      properties:
        penaltyRate:
          type: number
        loanPenaltyCalculationMethod:
          type: string
          enum: [NONE, OVERDUE_BALANCE, OVERDUE_BALANCE_AND_INTEREST, OVERDUE_BALANCE_INTEREST_AND_FEE, OUTSTANDING_PRINCIPAL]
        loanPenaltyGracePeriod:
          type: integer

    LoanPrepaymentSettings:
      type: object
      properties:
        prepaymentRecalculationMethod:
          type: string
          enum:
            - NO_RECALCULATION
            - RESCHEDULE_REMAINING_REPAYMENTS
            - RECALCULATE_SCHEDULE_KEEP_SAME_NUMBER_OF_TERMS
            - RECALCULATE_SCHEDULE_KEEP_SAME_PRINCIPAL_AMOUNT
            - RECALCULATE_SCHEDULE_KEEP_SAME_TOTAL_REPAYMENT_AMOUNT
            - REDUCE_AMOUNT_PER_INSTALLMENT
            - REDUCE_NUMBER_OF_INSTALLMENTS
            - REDUCE_NUMBER_OF_INSTALLMENTS_NEW
        futurePaymentsAcceptance:
          type: string
          enum: [NO_FUTURE_PAYMENTS, ACCEPT_FUTURE_PAYMENTS, ACCEPT_OVERPAYMENTS]
        principalPaidInstallmentStatus:
          type: string
          enum: [PARTIALLY_PAID, PAID, ORIGINAL_TOTAL_EXPECTED_PAID]
        elementsRecalculationMethod:
          type: string
          enum: [PRINCIPAL_EXPECTED_FIXED, TOTAL_EXPECTED_FIXED]
        applyInterestOnPrepaymentMethod:
          type: string
          enum: [AUTOMATIC, MANUAL]

    PrincipalPaymentSettings:
      type: object
      properties:
        amount:
          type: number
        percentage:
          type: number
        principalPaymentMethod:
          type: string
          enum: [FLAT, OUTSTANDING_PRINCIPAL_PERCENTAGE, PRINCIPAL_PERCENTAGE_LAST_DISB, TOTAL_BALANCE_PERCENTAGE, TOTAL_BALANCE_FLAT, TOTAL_PRINCIPAL_PERCENTAGE]
        totalDuePayment:
          type: string
          enum: [FLAT, OUTSTANDING_PRINCIPAL_PERCENTAGE, TOTAL_BALANCE_PERCENTAGE, TOTAL_BALANCE_FLAT, TOTAL_PRINCIPAL_PERCENTAGE]
        totalDueAmountFloor:
          type: number
        includeInterestInFloorAmount:
          type: boolean
        includeFeesInFloorAmount:
          type: boolean

    DisbursementDetails:
      type: object
      properties:
        expectedDisbursementDate:
          type: string
          format: date
        disbursementDate:
          type: string
          format: date
        firstRepaymentDate:
          type: string
          format: date
        transactionDetails:
          type: object
          properties:
            transactionChannelId:
              type: string
            transactionChannelKey:
              type: string
        fees:
          type: array
          items:
            type: object
            properties:
              predefinedFeeEncodedKey:
                type: string
              amount:
                type: number

    LoanBalances:
      type: object
      readOnly: true
      properties:
        principalDue:
          type: number
        principalPaid:
          type: number
        principalBalance:
          type: number
        interestDue:
          type: number
        interestPaid:
          type: number
        interestBalance:
          type: number
        interestFromArrearsBalance:
          type: number
        interestFromArrearsDue:
          type: number
        interestFromArrearsPaid:
          type: number
        feesDue:
          type: number
        feesPaid:
          type: number
        feesBalance:
          type: number
        penaltyDue:
          type: number
        penaltyPaid:
          type: number
        penaltyBalance:
          type: number
        holdBalance:
          type: number
        redrawBalance:
          type: number
        totalBalance:
          type: number

    FeesAccountSettings:
      type: object
      properties:
        fees:
          type: array
          items:
            type: object
            properties:
              encodedKey:
                type: string
              predefinedFeeKey:
                type: string
              amount:
                type: number

    AccountArrearsSettings:
      type: object
      properties:
        toleranceCalculationMethod:
          type: string
        tolerancePeriod:
          type: integer
        toleranceFloorAmount:
          type: number
        tolerancePercentageOfOutstandingPrincipal:
          type: number
        dateCalculationMethod:
          type: string
        nonWorkingDaysMethod:
          type: string

    RedrawSettings:
      type: object
      properties:
        allowRedraw:
          type: boolean

    Guarantor:
      type: object
      properties:
        encodedKey:
          type: string
          readOnly: true
        guarantorKey:
          type: string
        guarantorType:
          type: string
          enum: [CLIENT, GROUP]
        amount:
          type: number
        assetName:
          type: string
        depositAccountKey:
          type: string
        savingsAccountKey:
          type: string

    Asset:
      type: object
      properties:
        encodedKey:
          type: string
          readOnly: true
        assetName:
          type: string
        amount:
          type: number
        depositAccountKey:
          type: string
        originalAmount:
          type: number
        originalCurrency:
          $ref: "#/components/schemas/Currency"

    InvestorFund:
      type: object
      properties:
        encodedKey:
          type: string
          readOnly: true
        savingsAccountKey:
          type: string
        amount:
          type: number
        sharePercentage:
          type: number
        interestCommission:
          type: number

    LoanTranche:
      type: object
      properties:
        encodedKey:
          type: string
          readOnly: true
        amount:
          type: number
        expectedDisbursementDate:
          type: string
          format: date
        disbursementTransactionKey:
          type: string
        trancheNumber:
          type: integer
        fees:
          type: array
          items:
            type: object
            properties:
              predefinedFeeEncodedKey:
                type: string
              amount:
                type: number

    PlannedInstallmentFee:
      type: object
      properties:
        encodedKey:
          type: string
          readOnly: true
        predefinedFeeKey:
          type: string
        amount:
          type: number
        installmentKey:
          type: string
        installmentNumber:
          type: integer
        applyOnDate:
          type: string
          format: date

    # ── Loan Transaction ──
    LoanTransaction:
      type: object
      properties:
        encodedKey:
          type: string
          readOnly: true
        id:
          type: string
        externalId:
          type: string
        type:
          type: string
          enum:
            - IMPORT
            - DISBURSEMENT
            - DISBURSEMENT_ADJUSTMENT
            - WRITE_OFF
            - WRITE_OFF_ADJUSTMENT
            - REPAYMENT
            - PAYMENT_MADE
            - WITHDRAWAL_REDRAW
            - WITHDRAWAL_REDRAW_ADJUSTMENT
            - FEE_APPLIED
