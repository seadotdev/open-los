openapi: "3.1.0"
info:
  title: Mambu Banking Engine API v2
  description: |
    Complete OpenAPI specification for the Mambu cloud banking platform API v2.
    Mambu provides core banking capabilities including client management,
    loan origination & servicing, deposit accounts, accounting, and more.

    ## Authentication
    All endpoints require one of:
    - **API Key**: `apiKey` header with a UUID token from an API Consumer
    - **Basic Auth**: Standard HTTP Basic Authentication

    ## Versioning
    API v2 uses content-type versioning via the Accept header:
    `Accept: application/vnd.mambu.v2+json`

    ## Base URL
    `https://{tenant}.mambu.com/api/`
  version: "2.0"
  contact:
    name: Mambu
    url: https://www.mambu.com
  license:
    name: Proprietary

servers:
  - url: https://{tenant}.mambu.com/api
    description: Production
    variables:
      tenant:
        default: demo
        description: Your Mambu tenant name
  - url: https://{tenant}.sandbox.mambu.com/api
    description: Sandbox
    variables:
      tenant:
        default: demo
        description: Your Mambu tenant name

tags:
  - name: Clients
    description: Client (customer/borrower) management
  - name: Groups
    description: Group entity management
  - name: Loan Accounts
    description: Loan account lifecycle management
  - name: Loan Transactions
    description: Loan financial transactions
  - name: Loan Products
    description: Loan product configuration
  - name: Loan Schedule
    description: Loan repayment schedule management
  - name: Deposit Accounts
    description: Deposit/savings account management
  - name: Deposit Transactions
    description: Deposit financial transactions
  - name: Deposit Products
    description: Deposit product configuration
  - name: Credit Arrangements
    description: Credit facility/line management
  - name: Cards
    description: Card operations and authorization holds
  - name: Branches
    description: Branch management
  - name: Centres
    description: Centre management
  - name: Users
    description: User management
  - name: GL Accounts
    description: General ledger accounts
  - name: Journal Entries
    description: GL journal entries
  - name: Tasks
    description: Task management
  - name: Documents
    description: Document management
  - name: Communications
    description: Messaging (email, SMS, webhooks)
  - name: API Consumers
    description: API consumer and key management
  - name: Configuration
    description: Configuration-as-Code (YAML)
  - name: Organization
    description: Organization setup and holidays
  - name: Accounting
    description: Interest accrual and accounting reports
  - name: Index Rates
    description: Index rate source management
  - name: Currencies
    description: Currency and exchange rate management

security:
  - ApiKeyAuth: []
  - BasicAuth: []

paths:
  # ── Clients ────────────────────────────────────────────────────────────
  /clients:
    get:
      operationId: getAllClients
      summary: List all clients
      tags: [Clients]
      parameters:
        - $ref: "#/components/parameters/OffsetParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/PaginationDetailsParam"
        - $ref: "#/components/parameters/DetailsLevelParam"
        - $ref: "#/components/parameters/SortByParam"
        - name: branchId
          in: query
          schema: { type: string }
        - name: centreId
          in: query
          schema: { type: string }
        - name: creditOfficerUsername
          in: query
          schema: { type: string }
        - name: firstName
          in: query
          schema: { type: string }
        - name: lastName
          in: query
          schema: { type: string }
        - name: idNumber
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, enum: [PENDING_APPROVAL, INACTIVE, ACTIVE, EXITED, BLACKLISTED, REJECTED] }
        - name: birthDate
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: List of clients
          content:
            application/vnd.mambu.v2+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createClient
      summary: Create a new client
      tags: [Clients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Client"
      responses:
        "201":
          description: Client created
          content:
            application/vnd.mambu.v2+json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /clients/{clientId}:
    parameters:
      - name: clientId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getClientById
      summary: Get client by ID or encoded key
      tags: [Clients]
      parameters:
        - $ref: "#/components/parameters/DetailsLevelParam"
      responses:
        "200":
          description: Client details
          content:
            application/vnd.mambu.v2+json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchClient
      summary: Partially update client
      tags: [Clients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/PatchOperation"
      responses:
        "200":
          description: Client updated
          content:
            application/vnd.mambu.v2+json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateClient
      summary: Full update of client
      tags: [Clients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Client"
      responses:
        "200":
          description: Client updated
          content:
            application/vnd.mambu.v2+json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      summary: Delete client
      tags: [Clients]
      responses:
        "204":
          description: Client deleted

  "/clients:search":
    post:
      operationId: searchClients
      summary: Search clients with filter criteria
      tags: [Clients]
      parameters:
        - $ref: "#/components/parameters/OffsetParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/PaginationDetailsParam"
        - $ref: "#/components/parameters/DetailsLevelParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchCriteria"
      responses:
        "200":
          description: Search results
          content:
            application/vnd.mambu.v2+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"

  /clients/{clientId}/creditarrangements:
    parameters:
      - name: clientId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getClientCreditArrangements
      summary: Get credit arrangements for client
      tags: [Clients]
      responses:
        "200":
          description: Credit arrangements
          content:
            application/vnd.mambu.v2+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditArrangement"

  /clients/{clientId}/role:
    parameters:
      - name: clientId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getClientRole
      summary: Get role for client
      tags: [Clients]
      responses:
        "200":
          description: Client role
          content:
            application/vnd.mambu.v2+json:
              schema:
                type: object

  /clients/{clientId}/documents:
    parameters:
      - name: clientId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getClientDocuments
      summary: Get documents metadata for client
      tags: [Documents]
      responses:
        "200":
          description: Document metadata list
          content:
            application/vnd.mambu.v2+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createClientDocument
      summary: Upload document for client
      tags: [Documents]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                description:
                  type: string
      responses:
        "201":
          description: Document uploaded
          content:
            application/vnd.mambu.v2+json:
              schema:
                $ref: "#/components/schemas/Document"

  # ── Groups ─────────────────────────────────────────────────────────────
  /groups:
    get:
      operationId: getAllGroups
      summary: List all groups
      tags: [Groups]
      parameters:
        - $ref: "#/components/parameters/OffsetParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/PaginationDetailsParam"
        - $ref: "#/components/parameters/DetailsLevelParam"
        - $ref: "#/components/parameters/SortByParam"
        - name: branchId
          in: query
          schema: { type: string }
        - name: centreId
          in: query
          schema: { type: string }
        - name: creditOfficerUsername
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of groups
          content:
            application/vnd.mambu.v2+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      operationId: createGroup
      summary: Create a new group
      tags: [Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Group"
      responses:
        "201":
          description: Group created
          content:
            application/vnd.mambu.v2+json:
              schema:
                $ref: "#/components/schemas/Group"

  /groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getGroupById
      summary: Get group by ID
      tags: [Groups]
      responses:
        "200":
          description: Group details
          content:
            application/vnd.mambu.v2+json:
              schema:
                $ref: "#/components/schemas/Group"
    patch:
      operationId: patchGroup
      summary: Partially update group
      tags: [Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/PatchOperation"
      responses:
        "200":
          description: Group updated
          content:
            application/vnd.mambu.v2+json:
              schema:
                $ref: "#/components/schemas/Group"
    put:
      operationId: updateGroup
      summary: Full update of group
      tags: [Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Group"
      responses:
        "200":
          description: Group updated
          content:
            application/vnd.mambu.v2+json:
              schema:
                $ref: "#/components/schemas/Group"
    delete:
      operationId: deleteGroup
      summary: Delete group
      tags: [Groups]
      responses:
        "204":
          description: Group deleted

  "/groups:search":
    post:
      operationId: searchGroups
      summary: Search groups
      tags: [Groups]
      parameters:
        - $ref: "#/components/parameters/OffsetParam"
        - $ref: "#/components/parameters/LimitParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchCriteria"
      responses:
        "200":
          description: Search results
          content:
            application/vnd.mambu.v2+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"

  /groups/{groupId}/creditarrangements:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getGroupCreditArrangements
      summary: Get credit arrangements for group
      tags: [Groups]
      responses:
        "200":
          description: Credit arrangements
          content:
            application/vnd.mambu.v2+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditArrangement"

  # ── Loan Accounts ──────────────────────────────────────────────────────
  /loans:
    get:
      operationId: getAllLoans
      summary: List all loan accounts
      tags: [Loan Accounts]
      parameters:
        - $ref: "#/components/parameters/OffsetParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/PaginationDetailsParam"
        - $ref: "#/components/parameters/DetailsLevelParam"
        - $ref: "#/components/parameters/SortByParam"
        - name: accountState
          in: query
          schema: { type: string }
        - name: accountHolderType
          in: query
          schema: { type: string, enum: [CLIENT, GROUP] }
        - name: accountHolderId
          in: query
          schema: { type: string }
        - name: branchId
          in: query
          schema: { type: string }
        - name: centreId
          in: query
          schema: { type: string }
        - name: creditOfficerUsername
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of loan accounts
          content:
            application/vnd.mambu.v2+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoanAccount"
    post:
      operationId: createLoan
      summary: Create a new loan account
      tags: [Loan Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanAccount"
      responses:
        "201":
          description: Loan account created
          content:
            application/vnd.mambu.v2+json:
              schema:
                $ref: "#/components/schemas/LoanAccount"
        "400":
          $ref: "#/components/responses/BadRequest"

  /loans/{loanAccountId}:
    parameters:
      - name: loanAccountId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getLoanById
      summary: Get loan account by ID
      tags: [Loan Accounts]
      parameters:
        - $ref: "#/components/parameters/DetailsLevelParam"
      responses:
        "200":
          description: Loan account details
          content:
            application/vnd.mambu.v2+json:
              schema:
                $ref: "#/components/schemas/LoanAccount"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchLoan
      summary: Partially update loan account
      tags: [Loan Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/PatchOperation"
      responses:
        "200":
          description: Loan updated
          content:
            application/vnd.mambu.v2+json:
              schema:
                $ref: "#/components/schemas/LoanAccount"
    put:
      operationId: updateLoan
      summary: Full update of loan account
      tags: [Loan Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanAccount"
      responses:
        "200":
          description: Loan updated
          content:
            application/vnd.mambu.v2+json:
              schema:
                $ref: "#/components/schemas/LoanAccount"
    delete:
      operationId: deleteLoan
      summary: Delete loan account
      tags: [Loan Accounts]
      responses:
        "204":
          description: Loan deleted

  "/loans:search":
    post:
      operationId: searchLoans
      summary: Search loan accounts
      tags: [Loan Accounts]
      parameters:
        - $ref: "#/components/parameters/OffsetParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/PaginationDetailsParam"
        - $ref: "#/components/parameters/DetailsLevelParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchCriteria"
      responses:
        "200":
          description: Search results
          content:
            application/vnd.mambu.v2+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoanAccount"

  "/loans/{loanAccountId}:changeState":
    parameters:
      - name: loanAccountId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: changeLoanState
      summary: Change loan account state (approve, reject, withdraw, close, etc.)
      tags: [Loan Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanAccountAction"
      responses:
        "200":
          description: State changed
          content:
            application/vnd.mambu.v2+json:
              schema:
                $ref: "#/components/schemas/LoanAccount"
        "409":
          $ref: "#/components/responses/Conflict"

  "/loans/{loanAccountId}:changeInterestRate":
    parameters:
      - name: loanAccountId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: changeLoanInterestRate
      summary: Change interest rate on loan
      tags: [Loan Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                interestRate:
                  type: number
                valueDate:
                  type: string
                  format: date
                notes:
                  type: string
      responses:
        "204":
          description: Interest rate changed

  "/loans/{loanAccountId}:changePeriodicPayment":
    parameters:
      - name: loanAccountId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: changeLoanPeriodicPayment
      summary: Change periodic payment amount
      tags: [Loan Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                notes:
                  type: string
      responses:
        "204":
          description: Payment changed

  "/loans/{loanAccountId}:applyInterest":
    parameters:
      - name: loanAccountId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: applyLoanInterest
      summary: Apply accrued interest to loan
      tags: [Loan Accounts]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                interestApplicationDate:
                  type: string
                  format: date
                notes:
                  type: string
      responses:
        "204":
          description: Interest applied

  "/loans/{loanAccountId}:writeOff":
    parameters:
      - name: loanAccountId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: writeOffLoan
      summary: Write off loan account
      tags: [Loan Accounts]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
      responses:
        "204":
          description: Loan written off

  "/loans/{loanAccountId}:undoWriteOff":
    parameters:
      - name: loanAccountId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: undoWriteOffLoan
      summary: Reverse loan write-off
      tags: [Loan Accounts]
      responses:
        "204":
          description: Write-off reversed

  "/loans/{loanAccountId}:payOff":
    parameters:
      - name: loanAccountId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: payOffLoan
      summary: Pay off entire loan balance
      tags: [Loan Accounts]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
      responses:
        "204":
          description: Loan paid off

  "/loans/{loanAccountId}:refinance":
    parameters:
      - name: loanAccountId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: refinanceLoan
      summary: Refinance loan into a new loan
      tags: [Loan Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanAccount"
      responses:
        "200":
          description: New loan created from refinance
          content:
            application/vnd.mambu.v2+json:
              schema:
                $ref: "#/components/schemas/LoanAccount"

  "/loans/{loanAccountId}:reschedule":
    parameters:
      - name: loanAccountId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: rescheduleLoan
      summary: Reschedule loan into a new loan
      tags: [Loan Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanAccount"
      responses:
        "200":
          description: New loan created from reschedule
          content:
            application/vnd.mambu.v2+json:
              schema:
                $ref: "#/components/schemas/LoanAccount"

  "/loans/{loanAccountId}:terminate":
    parameters:
      - name: loanAccountId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: terminateLoan
      summary: Terminate loan account
      tags: [Loan Accounts]
      responses:
        "204":
          description: Loan terminated

  "/loans:previewSchedule":
    post:
      operationId: previewLoanSchedule
      summary: Preview schedule for a loan without creating it
      tags: [Loan Schedule]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanAccount"
      responses:
        "200":
          description: Preview schedule
          content:
            application/vnd.mambu.v2+json:
              schema:
                type: object
                properties:
                  installments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Installment"

  /loans/{loanAccountId}/schedule:
    parameters:
      - name: loanAccountId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getLoanSchedule
      summary: Get repayment schedule for loan
      tags: [Loan Schedule]
      responses:
        "200":
          description: Loan schedule
          content:
            application/vnd.mambu.v2+json:
              schema:
                type: object
                properties:
                  installments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Installment"
    put:
      operationId: editLoanSchedule
      summary: Edit loan schedule
      tags: [Loan Schedule]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                installments:
                  type: array
                  items:
                    $ref: "#/components/schemas/Installment"
      responses:
        "200":
          description: Schedule updated

  /loans/{loanAccountId}/tranches:
    parameters:
      - name: loanAccountId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getLoanTranches
      summary: Get loan tranches
      tags: [Loan Accounts]
      responses:
        "200":
          description: Loan tranches
          content:
            application/vnd.mambu.v2+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoanTranche"
    put:
      operationId: editLoanTranches
      summary: Edit loan tranches
      tags: [Loan Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/LoanTranche"
      responses:
        "200":
          description: Tranches updated

  /loans/{loanAccountId}/funding:
    parameters:
      - name: loanAccountId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: createLoanFundingSources
      summary: Add funding sources to loan
      tags: [Loan Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/InvestorFund"
      responses:
        "201":
          description: Funding sources added
    put:
      operationId: updateLoanFundingSources
      summary: Replace all funding sources
      tags: [Loan Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/InvestorFund"
      responses:
        "200":
          description: Funding sources updated
    delete:
      operationId: deleteLoanFundingSources
      summary: Remove all funding sources
      tags: [Loan Accounts]
      responses:
        "204":
          description: Funding sources removed

