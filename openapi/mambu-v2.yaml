          format: date-time
          readOnly: true

    # ── Index Rate Source ──
    IndexRateSource:
      type: object
      properties:
        encodedKey:
          type: string
          readOnly: true
        id:
          type: string
        name:
          type: string
        notes:
          type: string
        type:
          type: string
        interestRateTerms:
          type: string
        indexRates:
          type: array
          items:
            $ref: "#/components/schemas/IndexRate"
    IndexRate:
      type: object
      properties:
        encodedKey:
          type: string
          readOnly: true
        id:
          type: string
        startDate:
          type: string
          format: date
        rate:
          type: number
        notes:
          type: string

    # ── API Consumer ──
    ApiConsumer:
      type: object
      properties:
        encodedKey:
          type: string
          readOnly: true
        id:
          type: string
        name:
          type: string
        access:
          type: object
          properties:
            administratorAccess:
              type: boolean
            canManageAllBranches:
              type: boolean
            permissions:
              type: array
              items:
                type: string
            managedBranches:
              type: array
              items:
                type: object
                properties:
                  branchKey:
                    type: string
        role:
          type: object
          properties:
            encodedKey:
              type: string
            id:
              type: string
        transactionLimits:
          type: object
          additionalProperties:
            type: number
        creationDate:
          type: string
          format: date-time
          readOnly: true

    # ── Change State Action ──
    LoanAccountAction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [APPROVE, UNDO_APPROVE, REJECT, UNDO_REJECT, WITHDRAW, UNDO_WITHDRAW, CLOSE, UNDO_CLOSE]
        notes:
          type: string
    DepositAccountAction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [APPROVE, UNDO_APPROVE, ACTIVATE, UNDO_ACTIVATE, CLOSE, UNDO_CLOSE, CLOSE_REJECT, UNDO_CLOSE_REJECT, CLOSE_WITHDRAW, UNDO_CLOSE_WITHDRAW, LOCK, UNLOCK, REOPEN, UNDO_REOPEN]
        notes:
          type: string
    CreditArrangementAction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [APPROVE, UNDO_APPROVE, REJECT, UNDO_REJECT, WITHDRAW, UNDO_WITHDRAW, CLOSE, UNDO_CLOSE]
        notes:
          type: string

  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized - invalid or missing credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict - resource state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
