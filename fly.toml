app = "open-los-demo"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  DEMO_MODE = "true"
  DB_PATH = "/data/los.db"
  CORS_ORIGINS = "*"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "los_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
