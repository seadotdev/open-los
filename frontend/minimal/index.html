<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open LOS</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <span class="logo-dot"></span>
                    <span class="logo-text" id="app-name">Open LOS</span>
                </div>
                <nav class="nav" id="main-nav">
                    <button class="nav-btn active" data-view="dashboard">Dashboard</button>
                    <button class="nav-btn" data-view="decisions">
                        Decisions
                        <span class="nav-badge" id="decisions-badge" hidden>0</span>
                    </button>
                    <button class="nav-btn" data-view="activity">Activity</button>
                </nav>
            </div>
            <div class="header-right">
                <div class="connection-dot" id="connection-status" title="API disconnected"></div>
                <button class="icon-btn" id="ai-toggle" title="AI Assistant (Ctrl+K)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- ═══ Dashboard View ═══ -->
            <section class="view active" id="view-dashboard">
                <!-- KPI Strip -->
                <div class="kpi-strip" id="kpi-strip">
                    <div class="kpi" data-kpi="total">
                        <span class="kpi-value" id="kpi-total">--</span>
                        <span class="kpi-label">Total</span>
                    </div>
                    <div class="kpi" data-kpi="pending">
                        <span class="kpi-value" id="kpi-pending">--</span>
                        <span class="kpi-label">Pending</span>
                    </div>
                    <div class="kpi" data-kpi="documents">
                        <span class="kpi-value" id="kpi-documents">--</span>
                        <span class="kpi-label">Documents</span>
                    </div>
                    <div class="kpi" data-kpi="stp">
                        <span class="kpi-value" id="kpi-stp">--</span>
                        <span class="kpi-label">STP Rate</span>
                    </div>
                </div>

                <!-- Pipeline Board -->
                <div class="pipeline-board" id="pipeline-board">
                    <!-- Columns rendered by JS from config.stages -->
                </div>

                <!-- Pass-Through Status -->
                <div class="passthrough-bar" id="passthrough-bar">
                    <div class="passthrough-header">
                        <span class="passthrough-dot"></span>
                        <span>Pass-through active</span>
                        <span class="passthrough-rules" id="passthrough-rule-count">0 rules</span>
                    </div>
                </div>
            </section>

            <!-- ═══ Decisions View ═══ -->
            <section class="view" id="view-decisions">
                <div class="decisions-header">
                    <h2>Pending Decisions</h2>
                    <div class="decisions-filters" id="severity-filters">
                        <button class="filter-pill active" data-severity="all">All</button>
                        <button class="filter-pill" data-severity="high">High</button>
                        <button class="filter-pill" data-severity="medium">Medium</button>
                        <button class="filter-pill" data-severity="low">Low</button>
                    </div>
                </div>
                <div class="decisions-list" id="decisions-list">
                    <!-- Rendered by JS -->
                </div>
            </section>

            <!-- ═══ Activity View ═══ -->
            <section class="view" id="view-activity">
                <div class="activity-header">
                    <h2>Activity</h2>
                    <div class="activity-filters">
                        <button class="filter-pill active" data-source="all">All</button>
                        <button class="filter-pill" data-source="ai">AI</button>
                        <button class="filter-pill" data-source="human">Human</button>
                    </div>
                </div>
                <div class="activity-feed" id="activity-feed">
                    <!-- Rendered by JS -->
                </div>
            </section>
        </main>

        <!-- AI Panel (slide-over) -->
        <aside class="ai-panel" id="ai-panel">
            <div class="ai-panel-header">
                <span>AI Assistant</span>
                <button class="close-btn" id="ai-close">&times;</button>
            </div>
            <div class="ai-panel-body" id="ai-messages">
                <div class="ai-msg system">
                    <p>I can help you review cases, explain decisions, or run assessments. Ask me anything about your pipeline.</p>
                </div>
            </div>
            <div class="ai-panel-input">
                <input type="text" id="ai-input" placeholder="Ask about a case, trigger, or decision…">
                <button id="ai-send">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
