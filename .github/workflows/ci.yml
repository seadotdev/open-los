name: CI Pipeline

on:
  workflow_run:
    workflows: ["risk-policy-gate"]
    types: [completed]
  push:
    branches: [main]

jobs:
  test:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck:ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:smoke
