name: review-agent-rerun

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  request-rerun:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/rerun-review')
    runs-on: ubuntu-latest
    steps:
      - name: Request review rerun with SHA dedupe
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- review-agent-auto-rerun -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.issue.number;

            const pr = await github.rest.pulls.get({ owner, repo, pull_number });
            const headSha = pr.data.head.sha;
            const trigger = `sha:${headSha}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull_number,
              per_page: 100,
            });

            const alreadyRequested = comments.some((comment) =>
              comment.body?.includes(marker) && comment.body?.includes(trigger),
            );

            if (alreadyRequested) {
              core.info(`Rerun already requested for ${trigger}`);
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body: `${marker}\n@coderabbitai please re-review\n${trigger}`,
            });
