name: Multi-Agent Collaboration
description: >
  Tests a scenario where a broker agent creates a deal and a
  separate underwriter agent evaluates it.

initial_state:
  entities:
    - type: company
      name: "Multi-Agent Corp"

goal:
  description: >
    Broker agent creates deal and advances to origination.
    Underwriter agent adds spreads and advances to underwriting.
  checks:
    - name: "Deal exists"
      type: count
      endpoint: /v1/deals
      expect: 1
      weight: 1

constraints:
  max_steps: 30
  max_time_seconds: 90
