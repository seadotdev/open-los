name: Entity Graph Construction
description: >
  Tests creating a company entity graph with ownership and directorship relationships.

goal:
  description: >
    Create a parent company, subsidiary, and two directors.
    Link them with appropriate relationships.
  checks:
    - name: "Entities created"
      type: count
      endpoint: /v1/entities
      expect: 4
      weight: 2

constraints:
  max_steps: 20
  max_time_seconds: 60
