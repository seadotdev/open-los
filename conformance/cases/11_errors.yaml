# ─────────────────────────────────────────────────────────────────────────────
# SECTION 3: State/Transition Errors (400)
# ─────────────────────────────────────────────────────────────────────────────

---
test: error_invalid_stage_transition
meta:
  name: "Invalid stage transition error"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Test Corp"
        jurisdiction: "GB"
        requested_amount: 100000
        purpose: "Working capital"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: skip_stage
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "closing"
    expect:
      status: 409
      json_path_assertions:
        - path: "$.error.code"
          eq: "INVALID_TRANSITION"

---
test: error_invalid_loan_state_transition
meta:
  name: "Invalid loan state transition error"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_lender", role: "lender" }

steps:
  - id: create_entity
    http:
      actor: "u_lender"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Test Corp"
    expect:
      status: 201
      save:
        entity_id: "$.id"

  - id: create_loan
    http:
      actor: "u_lender"
      method: POST
      path: /v1/loans
      json:
        account_holder_type: "CLIENT"
        account_holder_id: "${entity_id}"
        loan_amount: 10000000
    expect:
      status: 201
      save:
        loan_id: "$.id"

  - id: reject_loan
    http:
      actor: "u_lender"
      method: POST
      path: /v1/loans/${loan_id}/transactions
      json:
        type: "REJECT"
    expect:
      status: 201

  - id: approve_after_reject
    http:
      actor: "u_lender"
      method: POST
      path: /v1/loans/${loan_id}/transactions
      json:
        type: "APPROVAL"
    expect:
      status: 409
      json_path_assertions:
        - path: "$.error.code"
          eq: "INVALID_TRANSITION"

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 4: Permission Errors (403)
# ─────────────────────────────────────────────────────────────────────────────

---
test: error_stage_guard_requires_override
meta:
  name: "Stage guard error when override is required"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_originator", role: "originator" }

steps:
  - id: create_deal
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Incomplete Corp"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: transition_without_required_fields
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "origination"
    expect:
      status: 409
      json_path_assertions:
        - path: "$.error.code"
          eq: "STAGE_GUARD_FAILED"

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 5: Immutability Errors (405)
# ─────────────────────────────────────────────────────────────────────────────

---
test: error_audit_immutable_update
meta:
  name: "Audit events cannot be updated (405)"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Audit Corp"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: get_audit
    http:
      actor: "u_broker"
      method: GET
      path: /v1/deals/${deal_id}/audit
    expect:
      status: 200
      save:
        event_id: "$.events[0].id"

  - id: try_update_audit
    http:
      actor: "u_broker"
      method: PATCH
      path: /v1/deals/${deal_id}/audit/${event_id}
      json:
        actor: "hacker"
    expect:
      status: 405

---
test: error_audit_immutable_delete
meta:
  name: "Audit events cannot be deleted (405)"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
