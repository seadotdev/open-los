---
test: error_validation_invalid_date_format
meta:
  name: "Validation error for invalid date format"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_lender", role: "lender" }

steps:
  - id: create_entity
    http:
      actor: "u_lender"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Date Corp"
    expect:
      status: 201
      save:
        entity_id: "$.id"

  - id: create_loan
    http:
      actor: "u_lender"
      method: POST
      path: /v1/loans
      json:
        account_holder_type: "CLIENT"
        account_holder_id: "${entity_id}"
        loan_amount: 10000000
        first_repayment_date: "not-a-date"
    expect:
      status: 201
      save:
        loan_id: "$.id"

