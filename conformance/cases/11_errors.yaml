    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: get_audit
    http:
      actor: "u_broker"
      method: GET
      path: /v1/deals/${deal_id}/audit
    expect:
      status: 200
      save:
        event_id: "$.events[0].id"

  - id: try_delete_audit
    http:
      actor: "u_broker"
      method: DELETE
      path: /v1/deals/${deal_id}/audit/${event_id}
