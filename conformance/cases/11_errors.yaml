version: "0.1.0"
suite: errors
description: >
  Error handling specification tests. Defines the expected error response format
  and behavior for validation errors, not found errors, permission errors, and
  conflict errors. A conformant implementation must return these exact error
  structures.

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 1: Validation Errors (400)
# ─────────────────────────────────────────────────────────────────────────────

---
test: error_validation_missing_required_field
meta:
  name: "Validation error for missing required field"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }

steps:
  - id: create_deal_no_borrower
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        jurisdiction: "GB"
    expect:
      status: 400
      json_path_assertions:
        - path: "$.error"
          exists: true
        - path: "$.error.code"
          eq: "VALIDATION_ERROR"
        - path: "$.error.message"
          exists: true

---
test: error_validation_invalid_enum_value
meta:
  name: "Validation error for invalid enum value"
  now: "2026-01-15T10:00:00Z"

