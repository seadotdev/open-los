---
test: error_not_found_deal
meta:
  name: "Not found error for nonexistent deal"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }

steps:
  - id: get_nonexistent_deal
    http:
      actor: "u_broker"
      method: GET
      path: /v1/deals/nonexistent-id-12345
    expect:
      status: 404
      json_path_assertions:
        - path: "$.error"
          exists: true
        - path: "$.error.code"
          eq: "NOT_FOUND"

