# ─── Test 8: Ratio computation - leverage ───────────────────────────────────
---
test: ratio_leverage
meta:
  name: "Leverage = total_debt / (net_income + depreciation)"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_underwriter", role: "underwriter" }
      - { id: "u_broker", role: "broker" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Ratio Test Corp E"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  # net_income = revenue - cogs - operating_expense - interest_expense - tax
  #            = 150000000 - 90000000 - 20000000 - 5000000 - 15000000 = 20000000
  # leverage = total_debt / (net_income + depreciation) = 40000000 / (20000000 + 5000000) = 1.6
  - id: create_spread
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals/${deal_id}/spread
      json:
        entity_id: "e_ratio_e"
        period: "FY2024"
        line_items:
          - { category: "revenue", label: "Revenue", amount: 150000000 }
          - { category: "cogs", label: "COGS", amount: 90000000 }
          - { category: "operating_expense", label: "OpEx", amount: 20000000 }
          - { category: "interest_expense", label: "Interest", amount: 5000000 }
          - { category: "tax", label: "Tax", amount: 15000000 }
          - { category: "depreciation", label: "Depreciation", amount: 5000000 }
          - { category: "total_debt", label: "Total Debt", amount: 40000000 }
    expect:
      status: 200
      json_path_assertions:
        - path: "$.ratios.leverage"
          eq: 1.6

