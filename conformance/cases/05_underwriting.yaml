version: "0.1.0"
suite: underwriting
description: >
  Financial spreading and ratio computation: create spreads from JSON line items
  or CSV fixture, verify deterministic ratio calculations, multi-period handling,
  edge cases, audit trail, and validation. All monetary amounts are in minor
  units (cents). Ratios are rounded to 3 decimal places unless otherwise noted.

# ─── Test 1: Create spread with income statement line items ─────────────────
---
test: spread_create_income_statement
meta:
  name: "Create spread with income statement line items"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_underwriter", role: "underwriter" }
      - { id: "u_broker", role: "broker" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Northfield Manufacturing Ltd"
        jurisdiction: "GB"
        requested_amount: 50000000
        purpose: "Working capital"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: create_spread
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals/${deal_id}/spread
      json:
        entity_id: "e_northfield"
        period: "FY2024"
        line_items:
          - { category: "revenue", label: "Sales Revenue", amount: 120000000 }
          - { category: "cogs", label: "Cost of Goods Sold", amount: 72000000 }
          - { category: "operating_expense", label: "SG&A", amount: 18000000 }
          - { category: "interest_expense", label: "Interest on Term Loan", amount: 4000000 }
          - { category: "tax", label: "Corporation Tax", amount: 5200000 }
          - { category: "depreciation", label: "Depreciation & Amortisation", amount: 6000000 }
    expect:
      status: 200
      json_contains:
        entity_id: "e_northfield"
        period: "FY2024"
      json_path_assertions:
        - path: "$.spread_id"
          exists: true
        - path: "$.ratios.gross_margin"
          eq: 0.4

