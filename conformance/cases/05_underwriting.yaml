# ─── Test 6: Ratio computation - DSCR ──────────────────────────────────────
---
test: ratio_dscr
meta:
  name: "DSCR = (net_income + depreciation + interest_expense) / (interest_expense + principal_repayment)"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_underwriter", role: "underwriter" }
      - { id: "u_broker", role: "broker" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Ratio Test Corp C"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  # net_income = revenue - cogs - operating_expense - interest_expense - tax
  #            = 100000000 - 60000000 - 10000000 - 3000000 - 7000000 = 20000000
  # DSCR = (20000000 + 5000000 + 3000000) / (3000000 + 0) = 28000000 / 3000000 = 9.333
  - id: create_spread
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals/${deal_id}/spread
      json:
        entity_id: "e_ratio_c"
        period: "FY2024"
        line_items:
          - { category: "revenue", label: "Revenue", amount: 100000000 }
          - { category: "cogs", label: "COGS", amount: 60000000 }
          - { category: "operating_expense", label: "OpEx", amount: 10000000 }
          - { category: "interest_expense", label: "Interest", amount: 3000000 }
          - { category: "tax", label: "Tax", amount: 7000000 }
          - { category: "depreciation", label: "Depreciation", amount: 5000000 }
    expect:
      status: 200
      json_path_assertions:
        - path: "$.ratios.dscr"
          approx: { value: 9.333, tolerance: 0.001 }

