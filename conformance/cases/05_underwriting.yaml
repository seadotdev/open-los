# ─── Test 16: Edge case - negative equity ──────────────────────────────────
---
test: edge_negative_equity
meta:
  name: "Negative equity produces negative debt-to-equity ratio"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_underwriter", role: "underwriter" }
      - { id: "u_broker", role: "broker" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "NegEquity Ltd"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  # Negative equity = -20000000 (the business has accumulated losses)
  # debt_to_equity = 50000000 / -20000000 = -2.5
  - id: create_spread
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals/${deal_id}/spread
      json:
        entity_id: "e_negequity"
        period: "FY2024"
        line_items:
          - { category: "total_debt", label: "Total Debt", amount: 50000000 }
          - { category: "total_equity", label: "Total Equity (Deficit)", amount: -20000000 }
          - { category: "current_assets", label: "Current Assets", amount: 15000000 }
          - { category: "current_liabilities", label: "Current Liabilities", amount: 35000000 }
    expect:
      status: 200
      json_path_assertions:
        - path: "$.ratios.debt_to_equity"
          eq: -2.5
        # current_ratio still computes normally: 15M / 35M = 0.429
        - path: "$.ratios.current_ratio"
          approx: { value: 0.429, tolerance: 0.001 }

