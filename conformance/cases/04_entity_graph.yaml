# ─── Test 6: PATCH entity updates fields ─────────────────────────────────────
---
test: update_entity_fields
meta:
  name: "PATCH entity updates name and legal_name"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_underwriter", role: "underwriter" }

steps:
  - id: create
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Old Name Ltd"
    expect:
      status: 201
      save:
        entity_id: "$.id"

  - id: update
    http:
      actor: "u_underwriter"
      method: PATCH
      path: /v1/entities/${entity_id}
      json:
        name: "New Name Ltd"
        legal_name: "New Name Limited"
        lei: "529900ABCDEF12345678"
    expect:
      status: 200
      json_schema: "schemas/entity.schema.json"
      json_contains:
        id: "${entity_id}"
        name: "New Name Ltd"
        legal_name: "New Name Limited"
        lei: "529900ABCDEF12345678"

  - id: verify
    http:
      actor: "u_underwriter"
      method: GET
      path: /v1/entities/${entity_id}
    expect:
      status: 200
      json_contains:
        name: "New Name Ltd"
        legal_name: "New Name Limited"

# ─── Test 7: Update entity produces audit event ─────────────────────────────
---
test: update_entity_audit_event
meta:
  name: "Updating an entity produces an audit event"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_underwriter", role: "underwriter" }
      - { id: "u_broker", role: "broker" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Audit Entity Corp"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: create_entity
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Audit Entity Corp"
    expect:
      status: 201
      save:
        entity_id: "$.id"

  - id: link_entity
    http:
      actor: "u_underwriter"
      method: PATCH
      path: /v1/deals/${deal_id}
      json:
        primary_entity_id: "${entity_id}"
    expect:
      status: 200

  - id: update_entity
    http:
      actor: "u_underwriter"
      method: PATCH
      path: /v1/entities/${entity_id}
      json:
        name: "Audit Entity Corp (Renamed)"
    expect:
      status: 200

  - id: check_audit
    http:
      actor: "u_underwriter"
      method: GET
      path: /v1/deals/${deal_id}/audit
    expect:
      status: 200
      json_path_assertions:
        - path: "$.events.length"
          gte: 1
        - path: "$.events[?(@.type=='ENTITY_UPDATED')]"
          exists: true

