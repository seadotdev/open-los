# ─── Test 8: Create "owns" relationship with ownership_pct ───────────────────
---
test: create_owns_relationship
meta:
  name: "Create an ownership relationship between two company entities"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_underwriter", role: "underwriter" }

steps:
  - id: create_holdco
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Holdco Ltd"
    expect:
      status: 201
      save:
        holdco_id: "$.id"

  - id: create_opco
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Opco Ltd"
    expect:
      status: 201
      save:
        opco_id: "$.id"

  - id: create_relationship
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/relationships
      json:
        from_entity_id: "${holdco_id}"
        to_entity_id: "${opco_id}"
        type: "owns"
        ownership_pct: 75.5
    expect:
      status: 201
      json_schema: "schemas/relationship.schema.json"
      json_contains:
        from_entity_id: "${holdco_id}"
        to_entity_id: "${opco_id}"
        type: "owns"
        ownership_pct: 75.5
      json_path_assertions:
        - path: "$.id"
          exists: true
        - path: "$.created_at"
          exists: true

