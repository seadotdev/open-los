# ─── Test 11: Relationship with non-existent entity fails ───────────────────
---
test: relationship_nonexistent_entity
meta:
  name: "Cannot create relationship referencing non-existent entity IDs"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_underwriter", role: "underwriter" }

steps:
  - id: create_entity
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Real Entity Ltd"
    expect:
      status: 201
      save:
        real_id: "$.id"

  - id: bad_from_entity
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/relationships
      json:
        from_entity_id: "00000000-0000-0000-0000-000000000000"
        to_entity_id: "${real_id}"
        type: "owns"
        ownership_pct: 100
    expect:
      status: 404
      json_schema: "schemas/error.schema.json"
      json_contains:
        error:
          code: "NOT_FOUND"

  - id: bad_to_entity
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/relationships
      json:
        from_entity_id: "${real_id}"
        to_entity_id: "00000000-0000-0000-0000-000000000000"
        type: "owns"
        ownership_pct: 100
    expect:
      status: 404
      json_schema: "schemas/error.schema.json"
      json_contains:
        error:
          code: "NOT_FOUND"

# ─── Test 12: Duplicate relationship rejected ───────────────────────────────
---
test: relationship_duplicate_rejected
meta:
  name: "Cannot create duplicate relationship between the same entities"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_underwriter", role: "underwriter" }

steps:
  - id: create_a
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Entity A"
    expect:
      status: 201
      save:
        a_id: "$.id"

  - id: create_b
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Entity B"
    expect:
      status: 201
      save:
        b_id: "$.id"

  - id: create_rel
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/relationships
      json:
        from_entity_id: "${a_id}"
        to_entity_id: "${b_id}"
        type: "owns"
        ownership_pct: 100
    expect:
      status: 201

  - id: create_duplicate
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/relationships
      json:
        from_entity_id: "${a_id}"
        to_entity_id: "${b_id}"
        type: "owns"
        ownership_pct: 50
    expect:
      status: 409
      json_schema: "schemas/error.schema.json"
      json_contains:
        error:
          code: "CONFLICT"

# ─── Test 13: Ownership percentage must be 0-100 ────────────────────────────
---
test: ownership_pct_validation
meta:
  name: "Ownership_pct must be between 0 and 100 inclusive"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_underwriter", role: "underwriter" }

steps:
  - id: create_parent
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Parent Ltd"
    expect:
      status: 201
      save:
        parent_id: "$.id"

  - id: create_child
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Child Ltd"
    expect:
      status: 201
      save:
        child_id: "$.id"

  - id: over_100
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/relationships
      json:
        from_entity_id: "${parent_id}"
        to_entity_id: "${child_id}"
        type: "owns"
        ownership_pct: 150
    expect:
      status: 400
      json_schema: "schemas/error.schema.json"
      json_contains:
        error:
          code: "VALIDATION_ERROR"

  - id: negative
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/relationships
      json:
        from_entity_id: "${parent_id}"
        to_entity_id: "${child_id}"
        type: "owns"
        ownership_pct: -10
    expect:
      status: 400
      json_schema: "schemas/error.schema.json"
      json_contains:
        error:
          code: "VALIDATION_ERROR"

