# ─── Test 14: Link entity to deal as primary ────────────────────────────────
---
test: link_entity_to_deal
meta:
  name: "Set primary_entity_id on a deal to link an entity"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }
      - { id: "u_underwriter", role: "underwriter" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Linked Borrower Ltd"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: create_entity
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Linked Borrower Ltd"
        registration_number: "99887766"
        jurisdiction: "GB"
    expect:
      status: 201
      save:
        entity_id: "$.id"

  - id: link
    http:
      actor: "u_underwriter"
      method: PATCH
      path: /v1/deals/${deal_id}
      json:
        primary_entity_id: "${entity_id}"
    expect:
      status: 200
      json_contains:
        primary_entity_id: "${entity_id}"

  - id: verify
    http:
      actor: "u_underwriter"
      method: GET
      path: /v1/deals/${deal_id}
    expect:
      status: 200
      json_contains:
        primary_entity_id: "${entity_id}"

