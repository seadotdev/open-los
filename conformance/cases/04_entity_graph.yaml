# ─── Test 18: Entity type cannot be changed after creation ───────────────────
---
test: entity_type_immutable
meta:
  name: "Entity type cannot be changed via PATCH"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_underwriter", role: "underwriter" }

steps:
  - id: create
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Immutable Type Corp"
    expect:
      status: 201
      save:
        entity_id: "$.id"

  - id: try_change_type
    http:
      actor: "u_underwriter"
      method: PATCH
      path: /v1/entities/${entity_id}
      json:
        type: "person"
    expect:
      status: 400
      json_schema: "schemas/error.schema.json"
      json_contains:
        error:
          code: "VALIDATION_ERROR"

  - id: verify_unchanged
    http:
      actor: "u_underwriter"
      method: GET
      path: /v1/entities/${entity_id}
    expect:
      status: 200
      json_contains:
        type: "company"

# ─── Test 19: Deleting entity with relationships fails or cascades ───────────
