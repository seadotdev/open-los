version: "0.1.0"
suite: entity_graph
description: >
  Multi-entity graphs and relationships: create entities (company/person),
  attach identifiers, build ownership/guarantee/director relationships,
  link to deals, and query borrower-group sub-graphs.

# ═══════════════════════════════════════════════════════════════════════════════
# 1. Create entities
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Test 1: Create a company entity ──────────────────────────────────────────
---
test: create_company_entity
meta:
  name: "Create a company entity with minimal fields"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_underwriter", role: "underwriter" }

steps:
  - id: create
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Holdco Ltd"
    expect:
      status: 201
      json_schema: "schemas/entity.schema.json"
      json_contains:
        type: "company"
        name: "Holdco Ltd"
      json_path_assertions:
        - path: "$.id"
          exists: true
        - path: "$.created_at"
          exists: true

