# ─── Test 5: Entity with external identifiers array ─────────────────────────
---
test: entity_with_external_identifiers
meta:
  name: "Create entity with external identifiers (scheme/value pairs)"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_underwriter", role: "underwriter" }

steps:
  - id: create
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Indexed Corp"
        registration_number: "12345678"
        jurisdiction: "GB"
        identifiers:
          - scheme: "opencorporates"
            value: "gb/12345678"
          - scheme: "companies_house"
            value: "12345678"
    expect:
      status: 201
      json_schema: "schemas/entity.schema.json"
      json_contains:
        name: "Indexed Corp"
      json_path_assertions:
        - path: "$.identifiers.length"
          eq: 2
        - path: "$.identifiers[0].scheme"
          eq: "opencorporates"
        - path: "$.identifiers[0].value"
          eq: "gb/12345678"
        - path: "$.identifiers[1].scheme"
          eq: "companies_house"
        - path: "$.identifiers[1].value"
          eq: "12345678"

