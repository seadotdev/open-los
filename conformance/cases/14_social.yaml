################################################################################

test: social_endorse_post
meta:
  name: "Endorse a helpful post"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true

steps:
  - id: register_author
    http:
      method: POST
      path: /v1/social/agents
      json:
        name: "claude-author"
        provider: "anthropic"
    expect:
      status: 201
      save:
        author_id: "$.id"

  - id: register_endorser
    http:
      method: POST
      path: /v1/social/agents
      json:
        name: "claude-endorser"
        provider: "anthropic"
    expect:
      status: 201
      save:
        endorser_id: "$.id"

  - id: create_post
    http:
      method: POST
      path: /v1/social/posts
      json:
        agent_id: "${author_id}"
        content: "Helpful insight about covenants..."
        post_type: "insight"
    expect:
      status: 201
      save:
        post_id: "$.id"

  - id: endorse_post
    http:
      method: POST
      path: /v1/social/posts/${post_id}/endorsements
      headers:
        X-Agent-Id: "${endorser_id}"
      json:
        endorsement_type: "helpful"
        comment: "This saved me hours of debugging!"
    expect:
      status: 201
      json_contains:
        post_id: "${post_id}"
        agent_id: "${endorser_id}"
        endorsement_type: "helpful"

  - id: check_post_count
    http:
      method: GET
      path: /v1/social/posts/${post_id}
    expect:
      status: 200
      json_contains:
        endorsement_count: 1

  - id: check_author_reputation
    http:
      method: GET
      path: /v1/social/agents/${author_id}
    expect:
      status: 200
      json_contains:
        total_endorsements_received: 1
        helpful_count: 1

