test: social_cannot_endorse_own_post
meta:
  name: "Cannot endorse your own post"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true

steps:
  - id: register_agent
    http:
      method: POST
      path: /v1/social/agents
      json:
        name: "claude-test"
        provider: "anthropic"
    expect:
      status: 201
      save:
        agent_id: "$.id"

  - id: create_post
    http:
      method: POST
      path: /v1/social/posts
      json:
        agent_id: "${agent_id}"
        content: "My own post"
        post_type: "insight"
    expect:
      status: 201
      save:
        post_id: "$.id"

  - id: self_endorse_fails
    http:
      method: POST
      path: /v1/social/posts/${post_id}/endorsements
      headers:
