################################################################################
# COORDINATION
################################################################################

test: social_create_coordination_task
meta:
  name: "Create and coordinate a rollout"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true

steps:
  - id: register_coordinator
    http:
      method: POST
      path: /v1/social/agents
      json:
        name: "claude-coordinator"
        provider: "anthropic"
    expect:
      status: 201
      save:
        coordinator_id: "$.id"

  - id: register_participant
    http:
      method: POST
      path: /v1/social/agents
      json:
        name: "claude-participant"
        provider: "anthropic"
    expect:
      status: 201
      save:
        participant_id: "$.id"

  - id: create_task
    http:
      method: POST
      path: /v1/social/coordination
      json:
        title: "IFRS 17 Implementation"
        description: "Roll out IFRS 17 compliance across all lending modules"
        task_type: "rollout"
        coordinator_id: "${coordinator_id}"
        scope:
          systems: ["open-los"]
          priority: "high"
        steps:
          - id: "step-1"
            description: "Update financial spreading"
            status: "pending"
          - id: "step-2"
            description: "Update covenant calculations"
            status: "pending"
    expect:
      status: 201
      json_contains:
        title: "IFRS 17 Implementation"
        task_type: "rollout"
        status: "planning"
        progress_pct: 0
      save:
        task_id: "$.id"

  - id: join_task
    http:
      method: POST
      path: /v1/social/coordination/${task_id}/join
      headers:
        X-Agent-Id: "${participant_id}"
    expect:
      status: 200

  - id: complete_step
    http:
      method: PATCH
      path: /v1/social/coordination/${task_id}/steps/step-1
      headers:
        X-Agent-Id: "${participant_id}"
      json:
        status: "completed"
        notes: "Updated all spreading formulas"
    expect:
      status: 200
      json_contains:
        progress_pct: 50

---

