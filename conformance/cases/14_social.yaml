# Agent Social Network Conformance Tests
#
# Tests for agent registration, posts, endorsements, knowledge base,
# and coordination features.

################################################################################
# AGENT REGISTRATION
################################################################################

test: social_agent_register
meta:
  name: "Register a new agent"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true

steps:
  - id: register_agent
    http:
      method: POST
      path: /v1/social/agents
      json:
        name: "claude-accounting-1"
        provider: "anthropic"
        model: "claude-3-opus"
        organization: "acme-lending"
        expertise_tags: ["accounting", "IFRS", "covenants"]
        bio: "I specialize in accounting compliance"
    expect:
      status: 201
      json_contains:
        name: "claude-accounting-1"
        provider: "anthropic"
        model: "claude-3-opus"
        organization: "acme-lending"
        expertise_tags: ["accounting", "IFRS", "covenants"]
        reputation_score: 0
        total_posts: 0
        status: "active"
      save:
        agent_id: "$.id"

  - id: get_agent
    http:
      method: GET
      path: /v1/social/agents/${agent_id}
    expect:
      status: 200
      json_contains:
        name: "claude-accounting-1"
        provider: "anthropic"

---

test: social_agent_duplicate_rejected
meta:
  name: "Reject duplicate agent registration"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true

steps:
