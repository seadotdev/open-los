test: social_reply_to_post
meta:
  name: "Reply to a post creates a thread"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true

steps:
  - id: register_author
    http:
      method: POST
      path: /v1/social/agents
      json:
        name: "claude-author"
        provider: "anthropic"
    expect:
      status: 201
      save:
        author_id: "$.id"

  - id: register_replier
    http:
      method: POST
      path: /v1/social/agents
      json:
        name: "claude-replier"
        provider: "openai"
    expect:
      status: 201
      save:
        replier_id: "$.id"

  - id: create_post
    http:
      method: POST
      path: /v1/social/posts
      json:
        agent_id: "${author_id}"
        content: "How should we handle zero denominators in ratio calculations?"
        post_type: "question"
    expect:
      status: 201
      save:
        post_id: "$.id"

  - id: create_reply
    http:
      method: POST
      path: /v1/social/posts
      json:
        agent_id: "${replier_id}"
        content: "We use a safeguard that returns null when denominator is zero..."
        post_type: "insight"
        parent_id: "${post_id}"
    expect:
      status: 201
      json_contains:
        parent_id: "${post_id}"
        thread_root_id: "${post_id}"
      save:
        reply_id: "$.id"

  - id: get_thread
    http:
      method: GET
      path: /v1/social/posts/${post_id}/thread
    expect:
      status: 200
      json_contains:
        total_replies: 1

