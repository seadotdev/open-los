# ─── Test 12: Old audit events unchanged after new mutations ──────────────────
---
test: audit_immutable_old_events_unchanged
meta:
  name: "Old audit events remain unchanged after new mutations on the deal"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Acme Ltd"
        purpose: "Working capital"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: snapshot_audit_before
    http:
      actor: "u_broker"
      method: GET
      path: /v1/deals/${deal_id}/audit
    expect:
      status: 200
      save:
        first_event_id: "$.events[0].id"
        first_event_type: "$.events[0].type"
        first_event_timestamp: "$.events[0].timestamp"

  - id: update_deal
    http:
      actor: "u_broker"
      method: PATCH
      path: /v1/deals/${deal_id}
      json:
        purpose: "Expansion"
    expect:
      status: 200

  - id: snapshot_audit_after
    http:
      actor: "u_broker"
      method: GET
      path: /v1/deals/${deal_id}/audit
    expect:
      status: 200
      json_path_assertions:
        - path: "$.events.length"
          eq: 2
        - path: "$.events[0].id"
          eq: "${first_event_id}"
        - path: "$.events[0].type"
          eq: "${first_event_type}"
        - path: "$.events[0].timestamp"
