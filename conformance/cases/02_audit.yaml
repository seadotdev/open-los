meta:
  name: "PATCH on audit endpoint returns 405 Method Not Allowed"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Acme Ltd"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: get_audit
    http:
      actor: "u_broker"
      method: GET
      path: /v1/deals/${deal_id}/audit
    expect:
      status: 200
      save:
        event_id: "$.events[0].id"

  - id: try_patch
    http:
      actor: "u_broker"
      method: PATCH
      path: /v1/deals/${deal_id}/audit/${event_id}
      json:
        type: "TAMPERED"
    expect:
      status: 405
      json_schema: "schemas/error.schema.json"

