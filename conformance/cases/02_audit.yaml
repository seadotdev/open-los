# ─── Test 6: Stage transition produces STAGE_TRANSITION event ─────────────────
---
test: audit_stage_transition_event
meta:
  name: "Stage transition produces STAGE_TRANSITION audit event with from/to stages"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }
      - { id: "u_originator", role: "originator" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Acme Ltd"
        jurisdiction: "GB"
        requested_amount: 25000000
        purpose: "Working capital"
        borrower_registration_number: "12345678"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: transition
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "origination"
    expect:
      status: 200

  - id: get_audit
    http:
      actor: "u_originator"
      method: GET
      path: /v1/deals/${deal_id}/audit
    expect:
      status: 200
      json_schema: "schemas/audit-event.schema.json"
      json_path_assertions:
        - path: "$.events[1].type"
          eq: "STAGE_TRANSITION"
        - path: "$.events[1].changes[0].field"
          eq: "stage"
        - path: "$.events[1].changes[0].before"
          eq: "broker"
        - path: "$.events[1].changes[0].after"
          eq: "origination"

