---
test: audit_filter_by_type
meta:
  name: "Filter audit events by type returns only matching events"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Acme Ltd"
        purpose: "Working capital"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: update_deal
    http:
      actor: "u_broker"
      method: PATCH
      path: /v1/deals/${deal_id}
      json:
        purpose: "Expansion"
    expect:
      status: 200

  - id: upload_doc
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals/${deal_id}/documents
      json:
        doc_type: "accounts"
        filename: "accounts.csv"
        content_base64: "cmV2ZW51ZQ=="
    expect:
      status: 202

  - id: filter_by_type
    http:
      actor: "u_broker"
      method: GET
      path: /v1/deals/${deal_id}/audit?type=DEAL_UPDATED
    expect:
      status: 200
      json_path_assertions:
        - path: "$.events.length"
          eq: 1
        - path: "$.events[0].type"
          eq: "DEAL_UPDATED"

# ─── Test 17: Filter audit by actor ──────────────────────────────────────────
---
test: audit_filter_by_actor
meta:
  name: "Filter audit events by actor returns only that actor's events"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }
      - { id: "u_originator", role: "originator" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Acme Ltd"
        jurisdiction: "GB"
        requested_amount: 25000000
        purpose: "Working capital"
        borrower_registration_number: "12345678"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: transition
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "origination"
    expect:
      status: 200

  - id: filter_by_actor
    http:
      actor: "u_broker"
      method: GET
      path: /v1/deals/${deal_id}/audit?actor=u_originator
    expect:
      status: 200
      json_path_assertions:
        - path: "$.events.length"
          eq: 1
        - path: "$.events[0].actor_id"
          eq: "u_originator"
        - path: "$.events[0].type"
          eq: "STAGE_TRANSITION"

# ─── Test 18: Combined filters (type + actor) ────────────────────────────────
---
test: audit_filter_combined
meta:
  name: "Combined type and actor filters return intersection of matching events"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }
      - { id: "u_originator", role: "originator" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Acme Ltd"
        jurisdiction: "GB"
        requested_amount: 25000000
        purpose: "Working capital"
        borrower_registration_number: "12345678"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: broker_update
    http:
      actor: "u_broker"
      method: PATCH
      path: /v1/deals/${deal_id}
      json:
        purpose: "Expansion"
    expect:
      status: 200

  - id: transition
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
