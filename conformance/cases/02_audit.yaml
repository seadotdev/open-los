# ─── Test 15: Cursor-based pagination through large event list ────────────────
---
test: audit_pagination_cursor
meta:
  name: "Cursor-based pagination walks through all audit events"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Acme Ltd"
        purpose: "v0"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: update_1
    http:
      actor: "u_broker"
      method: PATCH
      path: /v1/deals/${deal_id}
      json:
        purpose: "v1"
    expect:
      status: 200

  - id: update_2
    http:
      actor: "u_broker"
      method: PATCH
      path: /v1/deals/${deal_id}
      json:
        purpose: "v2"
    expect:
      status: 200

  - id: update_3
    http:
      actor: "u_broker"
      method: PATCH
      path: /v1/deals/${deal_id}
      json:
        purpose: "v3"
    expect:
      status: 200

  - id: update_4
    http:
      actor: "u_broker"
      method: PATCH
      path: /v1/deals/${deal_id}
      json:
        purpose: "v4"
    expect:
      status: 200

  - id: page_1
    http:
      actor: "u_broker"
      method: GET
      path: /v1/deals/${deal_id}/audit?limit=2
    expect:
      status: 200
      json_path_assertions:
        - path: "$.events.length"
          eq: 2
        - path: "$.events[0].type"
          eq: "DEAL_CREATED"
        - path: "$.total"
          eq: 5
      save:
        cursor_1: "$.next_cursor"

  - id: page_2
    http:
      actor: "u_broker"
      method: GET
      path: /v1/deals/${deal_id}/audit?limit=2&cursor=${cursor_1}
    expect:
      status: 200
      json_path_assertions:
        - path: "$.events.length"
          eq: 2
      save:
        cursor_2: "$.next_cursor"

  - id: page_3
    http:
      actor: "u_broker"
      method: GET
      path: /v1/deals/${deal_id}/audit?limit=2&cursor=${cursor_2}
    expect:
      status: 200
      json_path_assertions:
        - path: "$.events.length"
          eq: 1

