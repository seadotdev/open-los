---
test: facility_status_transitions
meta:
  name: "Facility status can be updated through lifecycle"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_analyst", role: "analyst" }

steps:
  - id: create_deal
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Status Corp"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: create_facility
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/deals/${deal_id}/facilities
      json:
        type: "term_loan"
        amount: 20000000
    expect:
      status: 201
      json_contains:
        status: "proposed"
      save:
        facility_id: "$.id"

  - id: approve_facility
    http:
      actor: "u_analyst"
      method: PATCH
      path: /v1/deals/${deal_id}/facilities/${facility_id}
      json:
        status: "approved"
    expect:
      status: 200
      json_contains:
        status: "approved"

  - id: activate_facility
    http:
      actor: "u_analyst"
      method: PATCH
      path: /v1/deals/${deal_id}/facilities/${facility_id}
      json:
        status: "active"
    expect:
      status: 200
      json_contains:
        status: "active"

  - id: close_facility
    http:
      actor: "u_analyst"
      method: PATCH
      path: /v1/deals/${deal_id}/facilities/${facility_id}
      json:
        status: "closed"
    expect:
      status: 200
      json_contains:
        status: "closed"

