# ─────────────────────────────────────────────────────────────────────────────
# SECTION 5: Facility to Loan Conversion
# ─────────────────────────────────────────────────────────────────────────────

---
test: facility_to_loan_conversion
meta:
  name: "Create loan account from approved facility"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_analyst", role: "analyst" }

steps:
  - id: create_deal
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Loan Conversion Corp"
        jurisdiction: "GB"
        requested_amount: 50000000
        purpose: "Expansion"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: create_entity
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Loan Conversion Corp"
    expect:
      status: 201
      save:
        entity_id: "$.id"

  - id: create_facility
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/deals/${deal_id}/facilities
      json:
        type: "term_loan"
        amount: 50000000
        interest_rate_type: "fixed"
        interest_rate_value: 0.075
        term_months: 60
    expect:
      status: 201
      save:
        facility_id: "$.id"

  - id: approve_facility
    http:
      actor: "u_analyst"
      method: PATCH
      path: /v1/deals/${deal_id}/facilities/${facility_id}
      json:
        status: "approved"
    expect:
      status: 200

  - id: create_loan_from_facility
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/facilities/${facility_id}/loans
      json:
        dealId: "${deal_id}"
        accountHolderId: "${entity_id}"
        firstRepaymentDate: "2026-03-01"
        repaymentFrequency: "MONTHLY"
    expect:
      status: 201
      json_contains:
        facility_id: "${facility_id}"
        deal_id: "${deal_id}"
        loan_amount: 50000000
        state: "PENDING_APPROVAL"
      json_path_assertions:
        - path: "$.interest_rate"
          eq: 0.075
        - path: "$.term_months"
          eq: 60
      save:
        loan_id: "$.id"

---
test: facility_to_preapproved_loan
meta:
  name: "Create pre-approved loan from facility"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_analyst", role: "analyst" }

steps:
  - id: create_deal
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Pre-Approved Corp"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: create_entity
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Pre-Approved Corp"
    expect:
      status: 201
      save:
        entity_id: "$.id"

  - id: create_facility
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/deals/${deal_id}/facilities
      json:
        type: "term_loan"
