version: "0.1.0"
suite: facilities
description: >
  Facility management specification tests. Facilities define the terms of credit
  (term loan, revolver, letter of credit) and can be converted to loan accounts
  upon approval.

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 1: Facility Creation
# ─────────────────────────────────────────────────────────────────────────────

---
test: facility_create_term_loan
meta:
  name: "Create a term loan facility"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_analyst", role: "analyst" }

steps:
  - id: create_deal
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Facility Corp"
        jurisdiction: "GB"
        requested_amount: 50000000
        purpose: "Expansion"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: create_facility
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/deals/${deal_id}/facilities
      json:
        type: "term_loan"
        amount: 50000000
        currency: "GBP"
        interest_rate_type: "fixed"
        interest_rate_value: 0.075
        term_months: 60
    expect:
      status: 201
      json_contains:
        type: "term_loan"
        amount: 50000000
        currency: "GBP"
        status: "proposed"
      json_path_assertions:
        - path: "$.id"
          exists: true
        - path: "$.interest_rate_value"
          eq: 0.075
      save:
        facility_id: "$.id"

