# ─── Test 4: Clone entity into sandbox ───────────────────────────────────────
---
test: sandbox_clone_entity
meta:
  name: "Clone a spread into sandbox for modification"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_analyst", role: "analyst" }

steps:
  - id: create_deal
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Acme Ltd"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: create_spread
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/deals/${deal_id}/spreads
      json:
        entity_id: "acme-ltd"
        period: "FY2025"
        line_items:
          - category: "revenue"
            label: "Total Revenue"
            amount: 1000000
          - category: "cogs"
            label: "Cost of Goods Sold"
            amount: 600000
    expect:
      status: 201
      save:
        spread_id: "$.id"

  - id: create_sandbox
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/sandboxes
      json:
        name: "Revenue adjustment scenario"
        parent_type: "deal"
        parent_id: "${deal_id}"
    expect:
      status: 201
      save:
        sandbox_id: "$.id"

  - id: clone_spread
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/sandboxes/${sandbox_id}/entities/clone
      json:
        entity_type: "spread"
        entity_id: "${spread_id}"
    expect:
      status: 201
      json_contains:
        entity_type: "spread"
        origin: "cloned"
        original_entity_id: "${spread_id}"

