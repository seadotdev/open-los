# ─── Test 13: Cannot create checkpoint in archived sandbox ──────────────────
---
test: sandbox_archived_no_checkpoint
meta:
  name: "Cannot create checkpoint in archived sandbox"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_analyst", role: "analyst" }

steps:
  - id: create_sandbox
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/sandboxes
      json:
        name: "Analysis workspace"
        parent_type: "analysis"
    expect:
      status: 201
      save:
        sandbox_id: "$.id"

  - id: archive
    http:
      actor: "u_analyst"
      method: PATCH
      path: /v1/sandboxes/${sandbox_id}/status
