version: "0.1.0"
suite: sandboxes
description: >
  Sandbox version control: isolated workspaces for exploratory analysis.
  Sandboxes provide git-powered version control for experimental work,
  with checkpoints that can be restored at any point.

# ─── Test 1: Create a sandbox ────────────────────────────────────────────────
---
test: sandbox_create
meta:
  name: "Create a sandbox for a deal"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_analyst", role: "analyst" }

steps:
  - id: create_deal
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Acme Ltd"
        jurisdiction: "GB"
        requested_amount: 25000000
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: create_sandbox
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/sandboxes
      json:
        name: "What-if: Higher leverage scenario"
        description: "Exploring impact of 80% LTV instead of 65%"
        parent_type: "deal"
        parent_id: "${deal_id}"
    expect:
      status: 201
      json_contains:
        name: "What-if: Higher leverage scenario"
        parent_type: "deal"
        parent_id: "${deal_id}"
        status: "active"
      save:
        sandbox_id: "$.id"

