# ─── Test 8: Restore checkpoint ──────────────────────────────────────────────
---
test: sandbox_restore_checkpoint
meta:
  name: "Restore sandbox to a previous checkpoint"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_analyst", role: "analyst" }

steps:
  - id: create_sandbox
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/sandboxes
      json:
        name: "Analysis workspace"
        parent_type: "analysis"
    expect:
      status: 201
      save:
        sandbox_id: "$.id"

  - id: create_entity
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/sandboxes/${sandbox_id}/entities
      json:
        entity_type: "spread"
        entity_id: "spread_001"
        state: { revenue: 1000000 }
    expect:
      status: 201

  - id: create_checkpoint_1
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/sandboxes/${sandbox_id}/checkpoints
      json:
        name: "Before changes"
    expect:
      status: 201
      save:
        checkpoint_1_id: "$.id"

  - id: update_entity
    http:
      actor: "u_analyst"
      method: PATCH
      path: /v1/sandboxes/${sandbox_id}/entities/spread/spread_001
      json:
        state: { revenue: 2000000 }
    expect:
      status: 200

  - id: create_checkpoint_2
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/sandboxes/${sandbox_id}/checkpoints
      json:
        name: "After doubling revenue"
    expect:
      status: 201

  - id: restore
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/sandboxes/${sandbox_id}/checkpoints/${checkpoint_1_id}/restore
    expect:
      status: 200

  - id: verify_restored
    http:
      actor: "u_analyst"
      method: GET
      path: /v1/sandboxes/${sandbox_id}/entities
    expect:
      status: 200
      json_path_assertions:
        - path: "$.items[0].state.revenue"
          eq: 1000000

# ─── Test 9: Compare checkpoints ─────────────────────────────────────────────
---
test: sandbox_compare_checkpoints
meta:
  name: "Compare two checkpoints to see what changed"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_analyst", role: "analyst" }

steps:
  - id: create_sandbox
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/sandboxes
      json:
        name: "Analysis workspace"
        parent_type: "analysis"
    expect:
      status: 201
      save:
        sandbox_id: "$.id"

  - id: create_entity
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/sandboxes/${sandbox_id}/entities
      json:
        entity_type: "spread"
        entity_id: "spread_001"
        state: { revenue: 1000000 }
    expect:
      status: 201

  - id: checkpoint_1
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/sandboxes/${sandbox_id}/checkpoints
      json:
        name: "Initial state"
    expect:
      status: 201
      save:
        checkpoint_1_id: "$.id"

  - id: update_entity
    http:
      actor: "u_analyst"
      method: PATCH
      path: /v1/sandboxes/${sandbox_id}/entities/spread/spread_001
      json:
        state: { revenue: 1500000, margin: 0.4 }
    expect:
      status: 200

  - id: add_entity
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/sandboxes/${sandbox_id}/entities
      json:
        entity_type: "covenant"
        entity_id: "cov_001"
        state: { name: "DSCR", threshold: 1.25 }
    expect:
      status: 201

  - id: checkpoint_2
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/sandboxes/${sandbox_id}/checkpoints
      json:
        name: "After adjustments"
    expect:
      status: 201
      save:
        checkpoint_2_id: "$.id"

  - id: compare
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/sandboxes/${sandbox_id}/checkpoints/compare
      json:
        from_checkpoint_id: "${checkpoint_1_id}"
        to_checkpoint_id: "${checkpoint_2_id}"
    expect:
      status: 200
      json_path_assertions:
        - path: "$.changes.added.length"
          eq: 1
        - path: "$.changes.modified.length"
          eq: 1

