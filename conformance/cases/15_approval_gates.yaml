---
test: gate_emergency_bypass
meta:
  name: "Emergency bypass with required rationale"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_analyst", role: "analyst" }
      - { id: "u_cro", role: "chief_risk_officer" }

steps:
  - id: create_deal
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "BypassCo"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: create_gate
    http:
      actor: "u_cro"
      method: POST
      path: /v1/gates/policies
      json:
        action: "deal.stage_advance"
        mode: "human"
    expect:
      status: 201

  - id: trigger_gate
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "origination"
    expect:
      status: 428
      save:
        gate_record_id: "$.error.details.gate_record_id"

  # CRO bypasses the gate with rationale
  - id: bypass_gate
    http:
      actor: "u_cro"
      method: POST
      path: /v1/gates/records/${gate_record_id}/bypass
      json:
        rationale: "Emergency: client deadline tomorrow, all docs verified offline"
    expect:
      status: 200
      json_path_assertions:
        - { path: "$.status", eq: "bypassed" }

  # Now the advance should work with the bypassed gate
  - id: advance_with_bypass
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      headers:
        X-Gate-Record-Id: "${gate_record_id}"
      json:
        to_stage: "origination"
    expect:
      status: 200

