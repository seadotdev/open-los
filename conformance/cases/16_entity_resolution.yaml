# 8. Screening with audit trail
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Test 16: Screening creates audit event when linked to deal ──────────────
---
test: screening_audit_trail
meta:
  name: "Screening an entity linked to a deal produces an audit event"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }
      - { id: "u_compliance", role: "compliance" }

steps:
  - id: import_ref
    http:
      actor: "u_compliance"
      method: POST
      path: /v1/reference-data/import
      json:
        source: "dunl_spiq"
        records:
          - external_id: "100000148560"
            name: "Apple Inc."
            jurisdiction: "US"
            identifiers:
              lei: "HWUPKR0MPOU8FGXBT394"
    expect:
      status: 201

  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Apple Inc."
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: create_entity
    http:
      actor: "u_compliance"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Apple Inc."
        lei: "HWUPKR0MPOU8FGXBT394"
    expect:
      status: 201
      save:
        entity_id: "$.id"

  - id: link_entity
    http:
      actor: "u_compliance"
      method: PATCH
      path: /v1/deals/${deal_id}
      json:
        primary_entity_id: "${entity_id}"
    expect:
      status: 200

  - id: screen
    http:
      actor: "u_compliance"
      method: POST
      path: /v1/entities/${entity_id}/screen
      json:
        sources: ["dunl_spiq"]
    expect:
      status: 201

  - id: check_audit
    http:
      actor: "u_compliance"
      method: GET
      path: /v1/deals/${deal_id}/audit
    expect:
      status: 200
      json_path_assertions:
        - path: "$.events[?(@.type=='ENTITY_SCREENED')]"
          exists: true

