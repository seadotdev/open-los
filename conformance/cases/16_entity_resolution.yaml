version: "0.1.0"
suite: entity_resolution
description: >
  Entity resolution and AML/KYC screening: import reference data from open
  sources (S&P Capital IQ via DUNL.org, Companies House, GLEIF LEI), resolve
  entities against reference data, screen entities, and confirm/reject matches.

# ═══════════════════════════════════════════════════════════════════════════════
# 1. Import reference data
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Test 1: Import S&P Capital IQ reference data ────────────────────────────
---
test: import_reference_data
meta:
  name: "Import S&P Capital IQ reference data from DUNL.org"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_compliance", role: "compliance" }

steps:
  - id: import
    http:
      actor: "u_compliance"
      method: POST
      path: /v1/reference-data/import
      json:
        source: "dunl_spiq"
        records:
          - external_id: "100000148560"
            name: "Apple Inc."
            legal_name: "Apple Inc."
            jurisdiction: "US"
            entity_type: "company"
            status: "active"
            identifiers:
              lei: "HWUPKR0MPOU8FGXBT394"
              spiq_id: "100000148560"
            metadata:
              industry: "Technology Hardware"
              city: "Cupertino"
              country: "US"
          - external_id: "100000230001"
            name: "Microsoft Corporation"
            legal_name: "Microsoft Corporation"
            jurisdiction: "US"
            entity_type: "company"
            status: "active"
            identifiers:
              lei: "INR2EJN1ERAN0W5ZP974"
              spiq_id: "100000230001"
            metadata:
              industry: "Software"
              city: "Redmond"
              country: "US"
          - external_id: "100000560032"
            name: "Barclays PLC"
            legal_name: "Barclays PLC"
            jurisdiction: "GB"
            entity_type: "company"
            status: "active"
            identifiers:
              lei: "213800LBQA1Y9L22JB70"
              spiq_id: "100000560032"
              companies_house: "48839"
            metadata:
              industry: "Banking"
              city: "London"
              country: "GB"
    expect:
      status: 201
      json_contains:
        imported: 3
        source: "dunl_spiq"

