# ─── Test 5: Screen entity against reference data ───────────────────────────
---
test: screen_entity_matched
meta:
  name: "Screen an entity and get a high-confidence match"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_compliance", role: "compliance" }

steps:
  - id: import_ref
    http:
      actor: "u_compliance"
      method: POST
      path: /v1/reference-data/import
      json:
        source: "dunl_spiq"
        records:
          - external_id: "100000148560"
            name: "Apple Inc."
            jurisdiction: "US"
            identifiers:
              lei: "HWUPKR0MPOU8FGXBT394"
              spiq_id: "100000148560"
    expect:
      status: 201

  - id: create_entity
    http:
      actor: "u_compliance"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Apple Inc."
        lei: "HWUPKR0MPOU8FGXBT394"
        jurisdiction: "US"
    expect:
      status: 201
      save:
        entity_id: "$.id"

  - id: screen
    http:
      actor: "u_compliance"
      method: POST
      path: /v1/entities/${entity_id}/screen
      json:
        sources: ["dunl_spiq"]
    expect:
      status: 201
      json_path_assertions:
        - path: "$[0].status"
          eq: "matched"
        - path: "$[0].match_confidence"
          eq: 1
        - path: "$[0].external_id"
          eq: "100000148560"
        - path: "$[0].source"
          eq: "dunl_spiq"

