# ─── Test 3: Resolve entity by name ──────────────────────────────────────────
---
test: resolve_entity_by_name
meta:
  name: "Resolve a company name against reference data"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_compliance", role: "compliance" }

steps:
  - id: import
    http:
      actor: "u_compliance"
      method: POST
      path: /v1/reference-data/import
      json:
        source: "dunl_spiq"
        records:
          - external_id: "100000148560"
            name: "Apple Inc."
            jurisdiction: "US"
            identifiers:
              lei: "HWUPKR0MPOU8FGXBT394"
              spiq_id: "100000148560"
          - external_id: "100000230001"
            name: "Microsoft Corporation"
            jurisdiction: "US"
            identifiers:
              lei: "INR2EJN1ERAN0W5ZP974"
    expect:
      status: 201

  - id: resolve
    http:
      actor: "u_compliance"
      method: POST
      path: /v1/resolve
      json:
        name: "Apple Inc"
        source: "dunl_spiq"
    expect:
      status: 200
      json_path_assertions:
        - path: "$.candidates.length"
          gte: 1
        - path: "$.candidates[0].name"
          eq: "Apple Inc."
        - path: "$.candidates[0].confidence"
          gte: 0.8
        - path: "$.source"
          eq: "dunl_spiq"

