---
test: reference_data_stats
meta:
  name: "Get reference data statistics"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_compliance", role: "compliance" }

steps:
  - id: import
    http:
      actor: "u_compliance"
      method: POST
      path: /v1/reference-data/import
      json:
        source: "dunl_spiq"
        records:
          - external_id: "100000148560"
            name: "Apple Inc."
            jurisdiction: "US"
            identifiers:
              lei: "HWUPKR0MPOU8FGXBT394"
    expect:
      status: 201

  - id: stats
    http:
      actor: "u_compliance"
      method: GET
      path: /v1/reference-data/stats
    expect:
      status: 200
      json_contains:
        total: 1
      json_path_assertions:
        - path: "$.by_source.dunl_spiq"
          eq: 1

