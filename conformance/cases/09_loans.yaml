# ─────────────────────────────────────────────────────────────────────────────
# SECTION 3: State Machine - Happy Path (Approval → Disbursement → Active)
# ─────────────────────────────────────────────────────────────────────────────

---
test: loan_approve_happy_path
meta:
  name: "Approve a loan in PENDING_APPROVAL state"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_lender", role: "lender" }

steps:
  - id: create_entity
    http:
      actor: "u_lender"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Approved Corp"
    expect:
      status: 201
      save:
        entity_id: "$.id"

  - id: create_loan
    http:
      actor: "u_lender"
      method: POST
      path: /v1/loans
      json:
        account_holder_type: "CLIENT"
        account_holder_id: "${entity_id}"
        loan_amount: 10000000
    expect:
      status: 201
      json_contains:
        state: "PENDING_APPROVAL"
      save:
        loan_id: "$.id"

  - id: approve
    http:
      actor: "u_lender"
      method: POST
      path: /v1/loans/${loan_id}/transactions
      json:
        type: "APPROVAL"
        notes: "Credit committee approved"
    expect:
      status: 201
      json_contains:
        type: "APPROVAL"
        loan_account_id: "${loan_id}"

  - id: verify_approved
    http:
      actor: "u_lender"
      method: GET
      path: /v1/loans/${loan_id}
    expect:
      status: 200
      json_contains:
        state: "APPROVED"
      json_path_assertions:
        - path: "$.approved_at"
          exists: true
        - path: "$.approved_by"
          eq: "u_lender"

