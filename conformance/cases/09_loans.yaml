version: "0.1.0"
suite: loans
description: >
  Loan ledger specification tests. Covers the complete loan account lifecycle:
  state machine transitions, financial operations (disbursement, repayment, fees),
  balance tracking, arrears management, and idempotency guarantees.

  The loan state machine: PENDING_APPROVAL → APPROVED → ACTIVE → CLOSED
  with branches for rejection, withdrawal, arrears, and locking.

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 1: Loan Account Creation
# ─────────────────────────────────────────────────────────────────────────────

---
test: loan_create_basic
meta:
  name: "Create a loan account with minimal required fields"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_lender", role: "lender" }

steps:
  # First create an entity to be the account holder
  - id: create_entity
    http:
      actor: "u_lender"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Borrower Corp"
        jurisdiction: "GB"
    expect:
      status: 201
      save:
        entity_id: "$.id"

  - id: create_loan
    http:
      actor: "u_lender"
      method: POST
      path: /v1/loans
      json:
        account_holder_type: "CLIENT"
        account_holder_id: "${entity_id}"
        loan_amount: 10000000
    expect:
      status: 201
      json_contains:
        state: "PENDING_APPROVAL"
        loan_amount: 10000000
        currency: "USD"
        principal_disbursed: 0
        principal_outstanding: 0
      json_path_assertions:
        - path: "$.id"
          exists: true
        - path: "$.account_id"
          regex: "^LN-\\d{5}$"
        - path: "$.encoded_key"
          exists: true
      save:
        loan_id: "$.id"
        account_id: "$.account_id"
        encoded_key: "$.encoded_key"

