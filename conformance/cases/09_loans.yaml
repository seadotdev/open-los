---
test: loan_reject_from_pending_approval
meta:
  name: "Reject a loan in PENDING_APPROVAL state"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_lender", role: "lender" }

steps:
  - id: create_entity
    http:
      actor: "u_lender"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Rejected Corp"
    expect:
      status: 201
      save:
        entity_id: "$.id"

  - id: create_loan
    http:
      actor: "u_lender"
      method: POST
      path: /v1/loans
      json:
        account_holder_type: "CLIENT"
        account_holder_id: "${entity_id}"
        loan_amount: 10000000
    expect:
      status: 201
      save:
        loan_id: "$.id"

  - id: reject
    http:
      actor: "u_lender"
      method: POST
      path: /v1/loans/${loan_id}/transactions
      json:
        type: "REJECT"
        notes: "Credit score too low"
    expect:
      status: 201
      json_contains:
        type: "REJECT"

  - id: verify_closed_rejected
    http:
      actor: "u_lender"
      method: GET
      path: /v1/loans/${loan_id}
    expect:
      status: 200
      json_contains:
        state: "CLOSED"
        sub_state: "REJECTED"
      json_path_assertions:
        - path: "$.closed_at"
          exists: true

