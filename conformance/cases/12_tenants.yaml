# ─────────────────────────────────────────────────────────────────────────────
# SECTION 3: Tenant Isolation - Loans
# ─────────────────────────────────────────────────────────────────────────────

---
test: tenant_loan_isolation
meta:
  name: "Loans are isolated between tenants"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_lender", role: "lender" }

steps:
  - id: create_entity_t1
    http:
      actor: "u_lender"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Tenant 1 Borrower"
    expect:
      status: 201
      save:
        entity_id: "$.id"

  - id: create_loan_t1
    http:
      actor: "u_lender"
      method: POST
      path: /v1/loans
      json:
        account_holder_type: "CLIENT"
        account_holder_id: "${entity_id}"
        loan_amount: 10000000
    expect:
      status: 201
      json_path_assertions:
        - path: "$.account_id"
          eq: "LN-00001"
      save:
        loan_id: "$.id"

---
test: tenant_loan_account_id_per_tenant
meta:
  name: "Loan account IDs are sequential per tenant"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: false
  seed:
    tenant: { id: "t2" }
    users:
      - { id: "u_lender_t2", role: "lender" }

steps:
  # Tenant 2 starts fresh with LN-00001
  - id: create_entity_t2
    http:
      actor: "u_lender_t2"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Tenant 2 Borrower"
    expect:
      status: 201
      save:
        entity_id: "$.id"

  - id: create_loan_t2
    http:
      actor: "u_lender_t2"
      method: POST
      path: /v1/loans
      json:
        account_holder_type: "CLIENT"
        account_holder_id: "${entity_id}"
        loan_amount: 20000000
    expect:
      status: 201
      json_path_assertions:
        - path: "$.account_id"
          eq: "LN-00001"

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 4: Tenant Isolation - Cross-Tenant Access Prevention
# ─────────────────────────────────────────────────────────────────────────────

---
test: tenant_cross_access_deal_not_found
meta:
  name: "Accessing another tenant's deal returns not found"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker_t1", role: "broker" }

steps:
  # Create deal in tenant 1
  - id: create_deal_t1
    http:
      actor: "u_broker_t1"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Secret Corp"
    expect:
      status: 201
      save:
        deal_id: "$.id"

---
test: tenant_cross_access_deal_blocked
meta:
  name: "Tenant 2 cannot access Tenant 1's deal"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: false
  seed:
    tenant: { id: "t2" }
    users:
      - { id: "u_broker_t2", role: "broker" }

steps:
  # First create a deal in T1 to get the ID
  - id: list_t2_deals
    http:
      actor: "u_broker_t2"
      method: GET
      path: /v1/deals
    expect:
      status: 200
      json_path_assertions:
        - path: "$.deals.length"
          eq: 0

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 5: Default Tenant Behavior
# ─────────────────────────────────────────────────────────────────────────────

---
test: tenant_default_tenant
meta:
  name: "Default tenant is used when X-Tenant-Id header is absent"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "default" }
    users:
      - { id: "u_broker", role: "broker" }

steps:
  - id: create_deal_default
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Default Tenant Corp"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: get_deal_default
    http:
      actor: "u_broker"
      method: GET
      path: /v1/deals/${deal_id}
    expect:
      status: 200
      json_contains:
        borrower_name: "Default Tenant Corp"

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 6: Tenant Isolation - Audit Trail
# ─────────────────────────────────────────────────────────────────────────────

---
test: tenant_audit_isolation
meta:
  name: "Audit events are isolated between tenants"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker_t1", role: "broker" }

steps:
  - id: create_deal_t1
    http:
      actor: "u_broker_t1"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Audit Test Corp"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: get_audit_t1
    http:
      actor: "u_broker_t1"
      method: GET
      path: /v1/deals/${deal_id}/audit
