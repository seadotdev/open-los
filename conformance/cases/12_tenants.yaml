version: "0.1.0"
suite: tenants
description: >
  Multi-tenant isolation specification tests. Ensures that data is properly
  isolated between tenants and that cross-tenant access is prevented.

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 1: Tenant Isolation - Deals
# ─────────────────────────────────────────────────────────────────────────────

---
test: tenant_deal_isolation
meta:
  name: "Deals are isolated between tenants"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }

steps:
  # Create deal in tenant 1
  - id: create_deal_t1
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Tenant 1 Corp"
        jurisdiction: "US"
        requested_amount: 5000000
        purpose: "working_capital"
    expect:
      status: 201
      save:
        deal_id_t1: "$.id"

  # List deals in tenant 1 - should see the deal
  - id: list_deals_t1
    http:
      actor: "u_broker"
      method: GET
      path: /v1/deals
    expect:
      status: 200
      json_path_assertions:
        - path: "$.deals.length"
          eq: 1
        - path: "$.deals[0].borrower_name"
          eq: "Tenant 1 Corp"

---
test: tenant_cross_tenant_deal_not_visible
meta:
  name: "Tenant cannot see another tenant's deals"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: false
  seed:
    tenant: { id: "t2" }
    users:
      - { id: "u_broker_t2", role: "broker" }
      - { id: "u_originator_t2", role: "originator" }

steps:
  # Create deal in tenant 2
  - id: create_deal_t2
    http:
      actor: "u_broker_t2"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Tenant 2 Corp"
    expect:
      status: 201

  # List deals in tenant 2 - should only see tenant 2's deal
  - id: list_deals_t2
    http:
      actor: "u_broker_t2"
      method: GET
      path: /v1/deals
    expect:
      status: 200
      json_path_assertions:
        - path: "$.deals.length"
          eq: 1
        - path: "$.deals[0].borrower_name"
          eq: "Tenant 2 Corp"

---
test: tenant_cross_tenant_stage_transition_blocked
meta:
  name: "Tenant cannot transition another tenant's deal"
  now: "2026-01-15T10:05:00Z"

arrange:
  reset_db: false
  seed:
    tenant: { id: "t2" }
    users:
      - { id: "u_originator_t2", role: "originator" }

steps:
  - id: transition_other_tenant_deal
    http:
      actor: "u_originator_t2"
      method: POST
      path: /v1/deals/${deal_id_t1}/stage-transitions
      json:
        to_stage: "origination"
        rationale: "Cross-tenant transition attempt"
    expect:
      status: 404

---
test: tenant_stage_history_isolation_setup
meta:
  name: "Stage history setup creates a transition in tenant 1"
  now: "2026-01-15T10:10:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker_t1", role: "broker" }
      - { id: "u_originator_t1", role: "originator" }

steps:
  - id: create_deal_for_history
    http:
      actor: "u_broker_t1"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Tenant 1 History Corp"
        jurisdiction: "US"
        requested_amount: 7500000
        purpose: "growth_capital"
    expect:
      status: 201
      save:
        history_deal_id_t1: "$.id"

  - id: transition_deal_for_history
    http:
      actor: "u_originator_t1"
      method: POST
      path: /v1/deals/${history_deal_id_t1}/stage-transitions
      json:
        to_stage: "origination"
        rationale: "Valid tenant 1 transition"
    expect:
      status: 200

---
test: tenant_cross_tenant_stage_history_blocked
meta:
  name: "Tenant cannot view another tenant's stage history"
  now: "2026-01-15T10:15:00Z"

arrange:
  reset_db: false
  seed:
    tenant: { id: "t2" }
    users:
      - { id: "u_originator_t2_history", role: "originator" }

steps:
  - id: get_other_tenant_stage_history
    http:
      actor: "u_originator_t2_history"
      method: GET
      path: /v1/deals/${history_deal_id_t1}/stage-transitions
    expect:
      status: 404

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 2: Tenant Isolation - Entities
# ─────────────────────────────────────────────────────────────────────────────

---
test: tenant_entity_isolation
meta:
  name: "Entities are isolated between tenants"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_analyst", role: "analyst" }

steps:
  - id: create_entity_t1
    http:
      actor: "u_analyst"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Tenant 1 Entity"
    expect:
      status: 201
      save:
        entity_id: "$.id"

  - id: list_entities_t1
    http:
      actor: "u_analyst"
      method: GET
      path: /v1/entities
    expect:
      status: 200
      json_path_assertions:
        - path: "$.entities.length"
          eq: 1

---
test: tenant_entity_cross_tenant_not_visible
meta:
  name: "Tenant cannot see another tenant's entities"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: false
  seed:
    tenant: { id: "t2" }
    users:
      - { id: "u_analyst_t2", role: "analyst" }

steps:
  - id: create_entity_t2
    http:
      actor: "u_analyst_t2"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Tenant 2 Entity"
    expect:
      status: 201

  - id: list_entities_t2
    http:
      actor: "u_analyst_t2"
      method: GET
      path: /v1/entities
    expect:
      status: 200
      json_path_assertions:
        - path: "$.entities.length"
          eq: 1
        - path: "$.entities[0].name"
          eq: "Tenant 2 Entity"

---
test: tenant_entity_resolution_setup
meta:
  name: "Entity resolution setup creates matching entities in two tenants"
  now: "2026-01-15T10:05:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_resolution_t1", role: "analyst" }

steps:
  - id: create_resolution_entity_t1
    http:
      actor: "u_resolution_t1"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Acme Holdings Ltd"
        registration_number: "12345678"
        jurisdiction: "GB"
    expect:
      status: 201
      save:
        resolution_entity_t1: "$.id"

---
test: tenant_entity_resolution_cross_tenant_fixture
meta:
  name: "Other tenants can create the same incoming identifier without leaking matches"
  now: "2026-01-15T10:05:00Z"

arrange:
  reset_db: false
  seed:
    tenant: { id: "t2" }
    users:
      - { id: "u_resolution_t2", role: "analyst" }

steps:
  - id: create_resolution_entity_t2
    http:
      actor: "u_resolution_t2"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Acme Holdings Ltd"
        registration_number: "12345678"
        jurisdiction: "GB"
    expect:
      status: 201
      save:
        resolution_entity_t2: "$.id"

---
test: tenant_entity_resolution_scoped
meta:
  name: "Entity resolution only returns same-tenant candidates"
  now: "2026-01-15T10:05:00Z"

arrange:
  reset_db: false
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_resolution_t1_lookup", role: "analyst" }

steps:
  - id: resolve_entity_t1
    http:
      actor: "u_resolution_t1_lookup"
      method: POST
      path: /v1/entities/resolve
      json:
        registration_number: "12345678"
        jurisdiction: "GB"
    expect:
      status: 200
      json_path_assertions:
        - path: "$.candidates.length"
          eq: 1
        - path: "$.candidates[0].entity_id"
          eq: "${resolution_entity_t1}"
        - path: "$.candidates[0].score"
          eq: 1
        - path: "$.candidates[0].source"
          eq: "local_entities"
        - path: "$.candidates[0].match_reasons[0]"
          eq: "exact_registration_number"

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 3: Tenant Isolation - Loans
# ─────────────────────────────────────────────────────────────────────────────

---
test: tenant_loan_isolation
meta:
  name: "Loans are isolated between tenants"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_lender", role: "lender" }

steps:
  - id: create_entity_t1
    http:
      actor: "u_lender"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Tenant 1 Borrower"
    expect:
      status: 201
      save:
        entity_id: "$.id"

  - id: create_loan_t1
    http:
      actor: "u_lender"
      method: POST
      path: /v1/loans
      json:
        account_holder_type: "CLIENT"
        account_holder_id: "${entity_id}"
        loan_amount: 10000000
    expect:
      status: 201
      json_path_assertions:
        - path: "$.account_id"
          eq: "LN-00001"
      save:
        loan_id: "$.id"

---
test: tenant_loan_account_id_per_tenant
meta:
  name: "Loan account IDs are sequential per tenant"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: false
  seed:
    tenant: { id: "t2" }
    users:
      - { id: "u_lender_t2", role: "lender" }

steps:
  # Tenant 2 starts fresh with LN-00001
  - id: create_entity_t2
    http:
      actor: "u_lender_t2"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Tenant 2 Borrower"
    expect:
      status: 201
      save:
        entity_id: "$.id"

  - id: create_loan_t2
    http:
      actor: "u_lender_t2"
      method: POST
      path: /v1/loans
      json:
        account_holder_type: "CLIENT"
        account_holder_id: "${entity_id}"
        loan_amount: 20000000
    expect:
      status: 201
      json_path_assertions:
        - path: "$.account_id"
          eq: "LN-00001"

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 4: Tenant Isolation - Cross-Tenant Access Prevention
# ─────────────────────────────────────────────────────────────────────────────

---
test: tenant_cross_access_deal_not_found
meta:
  name: "Accessing another tenant's deal returns not found"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker_t1", role: "broker" }

steps:
  # Create deal in tenant 1
  - id: create_deal_t1
    http:
      actor: "u_broker_t1"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Secret Corp"
    expect:
      status: 201
      save:
        deal_id: "$.id"

---
test: tenant_cross_access_deal_blocked
meta:
  name: "Tenant 2 cannot access Tenant 1's deal"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: false
  seed:
    tenant: { id: "t2" }
    users:
      - { id: "u_broker_t2", role: "broker" }

steps:
  # First create a deal in T1 to get the ID
  - id: list_t2_deals
    http:
      actor: "u_broker_t2"
      method: GET
      path: /v1/deals
    expect:
      status: 200
      json_path_assertions:
        - path: "$.deals.length"
          eq: 0

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 5: Default Tenant Behavior
# ─────────────────────────────────────────────────────────────────────────────

---
test: tenant_default_tenant
meta:
  name: "Default tenant is used when X-Tenant-Id header is absent"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "default" }
    users:
      - { id: "u_broker", role: "broker" }

steps:
  - id: create_deal_default
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Default Tenant Corp"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: get_deal_default
    http:
      actor: "u_broker"
      method: GET
      path: /v1/deals/${deal_id}
    expect:
      status: 200
      json_contains:
        borrower_name: "Default Tenant Corp"

