version: "0.1.0"
suite: tenants
description: >
  Multi-tenant isolation specification tests. Ensures that data is properly
  isolated between tenants and that cross-tenant access is prevented.

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 1: Tenant Isolation - Deals
# ─────────────────────────────────────────────────────────────────────────────

---
test: tenant_deal_isolation
meta:
  name: "Deals are isolated between tenants"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }

steps:
  # Create deal in tenant 1
  - id: create_deal_t1
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Tenant 1 Corp"
    expect:
      status: 201
      save:
        deal_id_t1: "$.id"

  # List deals in tenant 1 - should see the deal
  - id: list_deals_t1
    http:
      actor: "u_broker"
      method: GET
      path: /v1/deals
    expect:
      status: 200
      json_path_assertions:
        - path: "$.deals.length"
          eq: 1
        - path: "$.deals[0].borrower_name"
          eq: "Tenant 1 Corp"

---
test: tenant_cross_tenant_deal_not_visible
meta:
  name: "Tenant cannot see another tenant's deals"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: false
  seed:
    tenant: { id: "t2" }
    users:
      - { id: "u_broker_t2", role: "broker" }

steps:
  # Create deal in tenant 2
  - id: create_deal_t2
    http:
      actor: "u_broker_t2"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Tenant 2 Corp"
    expect:
      status: 201

  # List deals in tenant 2 - should only see tenant 2's deal
  - id: list_deals_t2
    http:
      actor: "u_broker_t2"
      method: GET
      path: /v1/deals
    expect:
      status: 200
      json_path_assertions:
        - path: "$.deals.length"
          eq: 1
        - path: "$.deals[0].borrower_name"
          eq: "Tenant 2 Corp"

