# ─── Test 11: Freeze rendered template as immutable artifact ──────────────────
---
test: templates_freeze_artifact
meta:
  name: "POST /v1/deals/{id}/artifacts freezes a rendered template as immutable artifact"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_originator", role: "originator" }
    templates:
      - id: "credit_memo"
        phase: "underwriting"
        doc_type: "credit_memo"
        version: "1.0.0"
        body: |
          # Credit Memo: {{borrower_name}}
          **Amount:** {{requested_amount}}

steps:
  - id: create_deal
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Foxtrot Ltd"
        requested_amount: 15000000
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: freeze
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals/${deal_id}/artifacts
      json:
        template_id: "credit_memo"
    expect:
      status: 201
      json_contains:
        template_id: "credit_memo"
        deal_id: "${deal_id}"
      json_path_assertions:
        - path: "$.markdown"
          contains: "Credit Memo: Foxtrot Ltd"
        - path: "$.markdown"
          contains: "15000000"
        - path: "$.id"
          exists: true
      save:
        artifact_id: "$.id"

# ─── Test 12: Retrieve frozen artifact ────────────────────────────────────────
---
test: templates_get_artifact
meta:
  name: "GET /v1/deals/{id}/artifacts returns frozen artifacts"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_originator", role: "originator" }
    templates:
      - id: "credit_memo"
        phase: "underwriting"
        doc_type: "credit_memo"
        version: "1.0.0"
        body: |
          # Credit Memo: {{borrower_name}}
          **Amount:** {{requested_amount}}

steps:
  - id: create_deal
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Golf Corp"
        requested_amount: 20000000
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: freeze
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals/${deal_id}/artifacts
      json:
        template_id: "credit_memo"
    expect:
      status: 201
      save:
        artifact_id: "$.id"

  - id: get_artifacts
    http:
      actor: "u_originator"
      method: GET
      path: /v1/deals/${deal_id}/artifacts
    expect:
      status: 200
      json_path_assertions:
        - path: "$.artifacts.length"
          eq: 1
        - path: "$.artifacts[0].id"
