version: "0.1.0"
suite: templates
description: >
  Template rendering conformance: listing, mustache variable injection,
  overrides, HTML export, frozen artifacts, and version tracking.

# ─── Test 1: List all templates ───────────────────────────────────────────────
---
test: templates_list_all
meta:
  name: "GET /v1/templates returns all available templates"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_originator", role: "originator" }
    templates:
      - id: "credit_memo"
        phase: "underwriting"
        doc_type: "credit_memo"
        version: "1.0.0"
        body: |
          # Credit Memo: {{borrower_name}}
          **Amount:** {{requested_amount}}
      - id: "deal_summary"
        phase: "origination"
        doc_type: "deal_summary"
        version: "1.0.0"
        body: |
          # Deal Summary
          Borrower: {{borrower_name}}
          Purpose: {{purpose}}
      - id: "closing_checklist"
        phase: "closing"
        doc_type: "closing_checklist"
        version: "1.0.0"
        body: |
          # Closing Checklist
          Deal: {{borrower_name}}

steps:
  - id: list_templates
    http:
      actor: "u_originator"
      method: GET
      path: /v1/templates
    expect:
      status: 200
      json_path_assertions:
        - path: "$.templates.length"
          eq: 3

# ─── Test 2: Filter templates by phase and doc_type ───────────────────────────
---
test: templates_filter_by_phase_and_doc_type
meta:
  name: "GET /v1/templates with phase and doc_type query filters"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_originator", role: "originator" }
    templates:
      - id: "credit_memo"
        phase: "underwriting"
        doc_type: "credit_memo"
        version: "1.0.0"
        body: |
          # Credit Memo: {{borrower_name}}
      - id: "risk_assessment"
        phase: "underwriting"
        doc_type: "risk_assessment"
        version: "1.0.0"
        body: |
          # Risk Assessment: {{borrower_name}}
      - id: "deal_summary"
        phase: "origination"
        doc_type: "deal_summary"
        version: "1.0.0"
        body: |
          # Deal Summary: {{borrower_name}}

steps:
  - id: filter_by_phase
    http:
      actor: "u_originator"
      method: GET
      path: /v1/templates?phase=underwriting
    expect:
      status: 200
      json_path_assertions:
        - path: "$.templates.length"
          eq: 2

  - id: filter_by_phase_and_doc_type
    http:
      actor: "u_originator"
      method: GET
      path: /v1/templates?phase=underwriting&doc_type=credit_memo
    expect:
      status: 200
      json_path_assertions:
        - path: "$.templates.length"
          eq: 1
        - path: "$.templates[0].id"
          eq: "credit_memo"

# ─── Test 3: Basic render with mustache variables ─────────────────────────────
---
test: templates_render_basic
meta:
  name: "Render template with deal context replaces mustache variables"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_originator", role: "originator" }
    templates:
      - id: "credit_memo"
        phase: "underwriting"
        doc_type: "credit_memo"
        version: "1.0.0"
        body: |
          # Credit Memo: {{borrower_name}}
          **Amount:** {{requested_amount}}
          **Purpose:** {{purpose}}

steps:
  - id: create_deal
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Acme Ltd"
        requested_amount: 25000000
        purpose: "Working capital"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: render
    http:
      actor: "u_originator"
      method: POST
      path: /v1/templates/render
      json:
        template_id: "credit_memo"
        deal_id: "${deal_id}"
    expect:
      status: 200
      json_contains:
        markdown: |
          # Credit Memo: Acme Ltd
          **Amount:** 25000000
          **Purpose:** Working capital

