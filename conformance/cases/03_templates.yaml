        - path: "$.artifacts[0].template_id"
          eq: "credit_memo"
        - path: "$.artifacts[0].markdown"
          contains: "Credit Memo: Golf Corp"

# ─── Test 13: Frozen artifact is immutable after deal data changes ────────────
---
test: templates_artifact_immutable
meta:
  name: "Frozen artifact markdown does not change when deal data is updated"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_originator", role: "originator" }
    templates:
      - id: "credit_memo"
        phase: "underwriting"
        doc_type: "credit_memo"
        version: "1.0.0"
        body: |
          # Credit Memo: {{borrower_name}}
          **Amount:** {{requested_amount}}

steps:
  - id: create_deal
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Hotel Industries"
        requested_amount: 30000000
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: freeze
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals/${deal_id}/artifacts
      json:
        template_id: "credit_memo"
    expect:
      status: 201
      save:
        artifact_id: "$.id"

  - id: update_deal
    http:
      actor: "u_originator"
      method: PATCH
      path: /v1/deals/${deal_id}
      json:
        borrower_name: "Hotel Industries (Renamed)"
        requested_amount: 50000000
    expect:
      status: 200

  - id: verify_artifact_unchanged
    http:
      actor: "u_originator"
      method: GET
      path: /v1/deals/${deal_id}/artifacts
    expect:
      status: 200
      json_path_assertions:
        - path: "$.artifacts[0].markdown"
          contains: "Credit Memo: Hotel Industries"
        - path: "$.artifacts[0].markdown"
          not_contains: "Renamed"
        - path: "$.artifacts[0].markdown"
          contains: "30000000"
        - path: "$.artifacts[0].markdown"
          not_contains: "50000000"

