version: "0.1.0"
suite: monitoring
description: >
  Monitoring stage conformance: bank transaction ingestion (JSON + CSV),
  liquidity computation, covenant monitoring, alert generation, audit trail,
  and input validation. All monetary amounts are integers in minor units
  (cents/pence). Negative = debit/outflow, positive = credit/inflow.

# ─── Helper: reusable setup macro ─────────────────────────────────────────────
# Many monitoring tests need a deal in the "monitoring" stage. The setup steps
# create a deal, transition it through broker -> origination -> underwriting ->
# closing -> monitoring, then optionally add covenants and spread data.
# Each test repeats these steps explicitly for isolation (reset_db: true).

# ═══════════════════════════════════════════════════════════════════════════════
#  1. INGEST BANK TRANSACTIONS VIA JSON
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Test 1: Ingest bank transactions (JSON, happy path) ─────────────────────
---
test: monitoring_ingest_json
meta:
  name: "Ingest bank transactions via JSON payload"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }
      - { id: "u_originator", role: "originator" }
      - { id: "u_underwriter", role: "underwriter" }
      - { id: "u_closer", role: "closer" }
      - { id: "u_monitor", role: "monitor" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Acme Ltd"
        jurisdiction: "GB"
        requested_amount: 25000000
        purpose: "Working capital"
        borrower_registration_number: "12345678"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: to_origination
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "origination"
    expect:
      status: 200

  - id: set_origination_outcome
    http:
      actor: "u_originator"
      method: PATCH
      path: /v1/deals/${deal_id}
      json:
        origination_outcome: "proceed"
    expect:
      status: 200

  - id: upload_document
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals/${deal_id}/documents
      json:
        doc_type: "application_form"
        filename: "application.pdf"
    expect:
      status: 202


  - id: create_spread
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals/${deal_id}/spread
      json:
        entity_id: "e_placeholder"
        period: "FY2024"
        line_items:
          - { category: "revenue", label: "Revenue", amount: 1000000 }
          - { category: "cogs", label: "COGS", amount: 600000 }
          - { category: "operating_expense", label: "OpEx", amount: 200000 }
    expect:
      status: 200
  - id: to_underwriting
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "underwriting"
    expect:
      status: 200

  - id: to_closing
    http:
      actor: "u_closer"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "closing"
    expect:
      status: 200

  - id: to_monitoring
    http:
      actor: "u_monitor"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "monitoring"
    expect:
      status: 200

  - id: ingest
    http:
      actor: "u_monitor"
      method: POST
      path: /v1/deals/${deal_id}/monitoring/ingest
      json:
        source_type: "bank_transactions"
        transactions:
          - { date: "2025-12-01", amount: -450000, description: "Office rent payment", category: "rent" }
          - { date: "2025-12-05", amount: 1200000, description: "Client invoice payment", category: "revenue" }
          - { date: "2025-12-10", amount: -85000, description: "Utility bills", category: "utilities" }
          - { date: "2025-12-15", amount: -120000, description: "Staff payroll", category: "payroll" }
          - { date: "2025-12-20", amount: -50000, description: "Office supplies", category: "supplies" }
    expect:
      status: 201
      json_contains:
        records_accepted: 5
      json_path_assertions:
        - path: "$.ingestion_id"
          exists: true
      save:
        ingestion_id: "$.ingestion_id"

