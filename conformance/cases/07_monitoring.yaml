# ─── Test 4: Liquidity status after ingestion ─────────────────────────────────
---
test: monitoring_liquidity_basic
meta:
  name: "Liquidity computed after bank transaction ingestion"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }
      - { id: "u_originator", role: "originator" }
      - { id: "u_underwriter", role: "underwriter" }
      - { id: "u_closer", role: "closer" }
      - { id: "u_monitor", role: "monitor" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Acme Ltd"
        jurisdiction: "GB"
        requested_amount: 25000000
        purpose: "Working capital"
        borrower_registration_number: "12345678"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: to_origination
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "origination"
    expect:
      status: 200

  - id: set_origination_outcome
    http:
      actor: "u_originator"
      method: PATCH
      path: /v1/deals/${deal_id}
      json:
        origination_outcome: "proceed"
    expect:
      status: 200

  - id: upload_document
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals/${deal_id}/documents
      json:
        doc_type: "application_form"
        filename: "application.pdf"
    expect:
      status: 202


  - id: create_spread
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals/${deal_id}/spread
      json:
        entity_id: "e_placeholder"
        period: "FY2024"
        line_items:
          - { category: "revenue", label: "Revenue", amount: 1000000 }
          - { category: "cogs", label: "COGS", amount: 600000 }
          - { category: "operating_expense", label: "OpEx", amount: 200000 }
    expect:
      status: 200
  - id: to_underwriting
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "underwriting"
    expect:
      status: 200

  - id: to_closing
    http:
      actor: "u_closer"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "closing"
    expect:
      status: 200

  - id: to_monitoring
    http:
      actor: "u_monitor"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "monitoring"
    expect:
      status: 200

  # Ingest 6 months of transactions with alternating positive/negative net months
  # Total balance ends positive. Some months burn (negative net), some don't.
  - id: ingest_txns
    http:
      actor: "u_monitor"
      method: POST
      path: /v1/deals/${deal_id}/monitoring/ingest
      json:
        source_type: "bank_transactions"
        transactions:
          # Month 1 (Jul): in 500000, out -800000 = net -300000 (burn)
          - { date: "2025-07-15", amount: -600000, description: "Rent Jul", category: "rent" }
          - { date: "2025-07-18", amount: 500000, description: "Revenue Jul", category: "revenue" }
          - { date: "2025-07-22", amount: -100000, description: "Utilities Jul", category: "utilities" }
          - { date: "2025-07-25", amount: -100000, description: "Payroll Jul", category: "payroll" }
          # Month 2 (Aug): in 2000000, out -500000 = net +1500000 (positive)
          - { date: "2025-08-01", amount: -300000, description: "Rent Aug", category: "rent" }
          - { date: "2025-08-05", amount: 2000000, description: "Revenue Aug", category: "revenue" }
          - { date: "2025-08-12", amount: -100000, description: "Insurance Aug", category: "insurance" }
          - { date: "2025-08-20", amount: -100000, description: "Payroll Aug", category: "payroll" }
          # Month 3 (Sep): in 400000, out -700000 = net -300000 (burn)
          - { date: "2025-09-01", amount: -500000, description: "Rent Sep", category: "rent" }
          - { date: "2025-09-10", amount: 400000, description: "Revenue Sep", category: "revenue" }
          - { date: "2025-09-15", amount: -100000, description: "Supplies Sep", category: "supplies" }
          - { date: "2025-09-25", amount: -100000, description: "Payroll Sep", category: "payroll" }
          # Month 4 (Oct): in 2500000, out -600000 = net +1900000 (positive)
          - { date: "2025-10-01", amount: -400000, description: "Rent Oct", category: "rent" }
          - { date: "2025-10-08", amount: 2500000, description: "Revenue Oct", category: "revenue" }
          - { date: "2025-10-18", amount: -100000, description: "Utilities Oct", category: "utilities" }
          - { date: "2025-10-28", amount: -100000, description: "Payroll Oct", category: "payroll" }
          # Month 5 (Nov): in 300000, out -600000 = net -300000 (burn)
          - { date: "2025-11-01", amount: -400000, description: "Rent Nov", category: "rent" }
          - { date: "2025-11-12", amount: 300000, description: "Revenue Nov", category: "revenue" }
          - { date: "2025-11-20", amount: -100000, description: "Marketing Nov", category: "marketing" }
          - { date: "2025-11-27", amount: -100000, description: "Payroll Nov", category: "payroll" }
          # Month 6 (Dec): in 2200000, out -500000 = net +1700000 (positive)
          - { date: "2025-12-01", amount: -300000, description: "Rent Dec", category: "rent" }
          - { date: "2025-12-09", amount: 2200000, description: "Revenue Dec", category: "revenue" }
          - { date: "2025-12-15", amount: -100000, description: "Maintenance Dec", category: "maintenance" }
          - { date: "2025-12-22", amount: -100000, description: "Payroll Dec", category: "payroll" }
    expect:
      status: 201
      json_contains:
        records_accepted: 24

  - id: check_status
    http:
      actor: "u_monitor"
      method: GET
      path: /v1/deals/${deal_id}/monitoring/status
    expect:
      status: 200
      json_path_assertions:
        - path: "$.liquidity.current_balance"
          exists: true
        - path: "$.liquidity.avg_monthly_burn"
          exists: true
        - path: "$.liquidity.runway_months"
          gte: 4.0
          lte: 20.0

# ─── Test 5: Liquidity with specific balance and burn rate ────────────────────
---
test: monitoring_liquidity_runway_calculation
meta:
  name: "Runway months calculated as current_balance / avg_monthly_burn"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }
      - { id: "u_originator", role: "originator" }
      - { id: "u_underwriter", role: "underwriter" }
      - { id: "u_closer", role: "closer" }
      - { id: "u_monitor", role: "monitor" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Runway Corp"
        jurisdiction: "GB"
        requested_amount: 50000000
        purpose: "Expansion"
        borrower_registration_number: "55556666"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: to_origination
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "origination"
    expect:
      status: 200

  - id: set_origination_outcome
    http:
      actor: "u_originator"
      method: PATCH
      path: /v1/deals/${deal_id}
      json:
        origination_outcome: "proceed"
    expect:
      status: 200

  - id: upload_document
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals/${deal_id}/documents
      json:
        doc_type: "application_form"
        filename: "application.pdf"
    expect:
      status: 202


  - id: create_spread
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals/${deal_id}/spread
      json:
        entity_id: "e_placeholder"
        period: "FY2024"
        line_items:
          - { category: "revenue", label: "Revenue", amount: 1000000 }
          - { category: "cogs", label: "COGS", amount: 600000 }
          - { category: "operating_expense", label: "OpEx", amount: 200000 }
    expect:
      status: 200
  - id: to_underwriting
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "underwriting"
    expect:
      status: 200

  - id: to_closing
    http:
      actor: "u_closer"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "closing"
    expect:
      status: 200

  - id: to_monitoring
    http:
      actor: "u_monitor"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "monitoring"
    expect:
      status: 200

  # Ingest 6 months with consistent burn of exactly 500000/month (net outflow)
  # and a current_balance of 3000000 => runway_months ~ 6.0
  - id: ingest_txns
    http:
      actor: "u_monitor"
      method: POST
      path: /v1/deals/${deal_id}/monitoring/ingest
      json:
        source_type: "bank_transactions"
        transactions:
          # Each month: debit -500000 only (pure burn, no revenue inflows)
          - { date: "2025-07-01", amount: -500000, description: "Operating costs Jul", category: "operations" }
          - { date: "2025-08-01", amount: -500000, description: "Operating costs Aug", category: "operations" }
          - { date: "2025-09-01", amount: -500000, description: "Operating costs Sep", category: "operations" }
          - { date: "2025-10-01", amount: -500000, description: "Operating costs Oct", category: "operations" }
          - { date: "2025-11-01", amount: -500000, description: "Operating costs Nov", category: "operations" }
          - { date: "2025-12-01", amount: -500000, description: "Operating costs Dec", category: "operations" }
          # Initial deposit to set current_balance to 3000000
          - { date: "2025-06-30", amount: 6000000, description: "Opening balance", category: "transfer" }
    expect:
      status: 201
      json_contains:
        records_accepted: 7

  - id: check_runway
    http:
      actor: "u_monitor"
      method: GET
      path: /v1/deals/${deal_id}/monitoring/status
    expect:
      status: 200
      json_path_assertions:
        - path: "$.liquidity.current_balance"
          eq: 3000000
        - path: "$.liquidity.avg_monthly_burn"
          eq: 500000
        - path: "$.liquidity.runway_months"
          gte: 5.5
          lte: 6.5

# ─── Test 6: Liquidity updates after additional ingestion ─────────────────────
---
test: monitoring_liquidity_updates_on_new_ingestion
meta:
  name: "Liquidity recalculates after new transactions are ingested"
  now: "2026-01-15T10:00:00Z"

