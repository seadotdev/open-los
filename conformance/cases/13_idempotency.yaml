version: "0.1.0"
suite: idempotency
description: >
  Idempotency specification tests. Verifies that operations with idempotency keys
  are properly deduplicated, ensuring the same operation can be safely retried
  without causing duplicate effects.

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 1: Loan Transaction Idempotency
# ─────────────────────────────────────────────────────────────────────────────

---
test: idempotency_disbursement_deduplication
meta:
  name: "Disbursement with same idempotency key returns same transaction"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_lender", role: "lender" }

steps:
  - id: create_entity
    http:
      actor: "u_lender"
      method: POST
      path: /v1/entities
      json:
        type: "company"
        name: "Idempotent Corp"
    expect:
      status: 201
      save:
        entity_id: "$.id"

  - id: create_loan
    http:
      actor: "u_lender"
      method: POST
      path: /v1/loans
      json:
        account_holder_type: "CLIENT"
        account_holder_id: "${entity_id}"
        loan_amount: 10000000
    expect:
      status: 201
      save:
        loan_id: "$.id"

  - id: approve
    http:
      actor: "u_lender"
      method: POST
      path: /v1/loans/${loan_id}/transactions
      json:
        type: "APPROVAL"
    expect:
      status: 201

  - id: disburse_first
    http:
      actor: "u_lender"
      method: POST
      path: /v1/loans/${loan_id}/transactions
      json:
        type: "DISBURSEMENT"
        amount: 5000000
        valueDate: "2026-01-15"
        idempotencyKey: "disbursement-key-001"
    expect:
      status: 201
      save:
        tx_id: "$.id"
        tx_encoded_key: "$.encoded_key"

  - id: disburse_retry
    http:
      actor: "u_lender"
      method: POST
      path: /v1/loans/${loan_id}/transactions
      json:
        type: "DISBURSEMENT"
        amount: 5000000
        valueDate: "2026-01-15"
        idempotencyKey: "disbursement-key-001"
    expect:
      status: 201
      json_path_assertions:
        - path: "$.id"
          eq: "${tx_id}"
        - path: "$.encoded_key"
          eq: "${tx_encoded_key}"

  - id: verify_single_disbursement
    http:
      actor: "u_lender"
      method: GET
      path: /v1/loans/${loan_id}
    expect:
      status: 200
      json_contains:
        principal_disbursed: 5000000
        principal_outstanding: 5000000

