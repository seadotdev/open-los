# ─── Test 10: Audit trail — EMAIL_INGESTED event ─────────────────────────────
---
test: email_ingest_audit_event
meta:
  name: "Email ingestion produces EMAIL_INGESTED audit event"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_originator", role: "originator" }

steps:
  - id: create_deal
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Acme Manufacturing Ltd"
        jurisdiction: "GB"
        requested_amount: 25000000
        purpose: "Working capital"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: ingest_email
    http:
      actor: "u_originator"
      method: POST
      path: /v1/email/ingest
      multipart:
        file: "conformance/fixtures/deals/deal_001_small_sme/docs/inbox_email_1.eml"
        deal_id: "${deal_id}"
    expect:
      status: 201
      save:
        communication_id: "$.communication_id"

  - id: check_audit
    http:
      actor: "u_originator"
      method: GET
      path: /v1/deals/${deal_id}/audit
    expect:
      status: 200
      json_path_assertions:
        - path: "$.events[?(@.type=='EMAIL_INGESTED')]"
          exists: true
        - path: "$.events[?(@.type=='EMAIL_INGESTED')].metadata.communication_id"
          eq: "${communication_id}"
        - path: "$.events[?(@.type=='EMAIL_INGESTED')].actor"
          eq: "u_originator"
