version: "0.1.0"
suite: email
description: >
  Email (.eml) ingestion, deal linking, attachment extraction, threading,
  communication listing, and audit trail.
  Covers: explicit deal link, auto-linking by subject token, attachment
  extraction as documents, email threading via In-Reply-To/References,
  communication listing, and EMAIL_INGESTED audit event.

# ─── Test 1: Ingest email with explicit deal link ─────────────────────────────
---
test: email_ingest_explicit_link
meta:
  name: "Ingest .eml file with explicit deal_id links to deal"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_originator", role: "originator" }

steps:
  - id: create_deal
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Acme Manufacturing Ltd"
        jurisdiction: "GB"
        requested_amount: 25000000
        purpose: "Working capital"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: ingest_email
    http:
      actor: "u_originator"
      method: POST
      path: /v1/email/ingest
      multipart:
        file: "conformance/fixtures/deals/deal_001_small_sme/docs/inbox_email_1.eml"
        deal_id: "${deal_id}"
    expect:
      status: 201
      json_contains:
        deal_id: "${deal_id}"
        type: "email"
      json_path_assertions:
        - path: "$.communication_id"
          exists: true
        - path: "$.subject"
          exists: true
        - path: "$.from"
          exists: true
        - path: "$.attachments"
          is_array: true
      save:
        communication_id: "$.communication_id"

# ─── Test 2: Ingested email appears in deal communications ────────────────────
---
test: email_ingest_explicit_link_appears_in_communications
meta:
  name: "Email ingested with deal_id appears in deal communications list"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_originator", role: "originator" }

steps:
  - id: create_deal
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Acme Manufacturing Ltd"
        jurisdiction: "GB"
        requested_amount: 25000000
        purpose: "Working capital"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: ingest_email
    http:
      actor: "u_originator"
      method: POST
      path: /v1/email/ingest
      multipart:
        file: "conformance/fixtures/deals/deal_001_small_sme/docs/inbox_email_1.eml"
        deal_id: "${deal_id}"
    expect:
      status: 201
      save:
        communication_id: "$.communication_id"

  - id: list_communications
    http:
      actor: "u_originator"
      method: GET
      path: /v1/deals/${deal_id}/communications
    expect:
      status: 200
      json_path_assertions:
        - path: "$.communications.length"
          gte: 1
        - path: "$.communications[0].id"
          eq: "${communication_id}"
        - path: "$.communications[0].type"
          eq: "email"
        - path: "$.communications[0].deal_id"
          eq: "${deal_id}"

# ─── Test 3: Auto-link email by subject token — match found ──────────────────
---
test: email_autolink_by_subject_match
meta:
  name: "Ingest email without deal_id auto-links when subject contains deal reference token"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_originator", role: "originator" }

steps:
  - id: create_deal
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Acme Manufacturing Ltd"
        jurisdiction: "GB"
        requested_amount: 25000000
        purpose: "Working capital"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: ingest_email_autolink
    http:
      actor: "u_originator"
      method: POST
      path: /v1/email/ingest
      json:
        raw_rfc822_base64: ""
        subject_override: "Re: Acme Manufacturing [DEAL-${deal_id}]"
    expect:
      status: 201
      json_contains:
        deal_id: "${deal_id}"
      json_path_assertions:
        - path: "$.communication_id"
          exists: true
        - path: "$.subject"
          contains: "DEAL-"

