# ─── Test 7: Email threading — two emails with same thread ───────────────────
---
test: email_threading_grouped
meta:
  name: "Two emails with same In-Reply-To thread_id are grouped together"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_originator", role: "originator" }

steps:
  - id: create_deal
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Acme Manufacturing Ltd"
        jurisdiction: "GB"
        requested_amount: 25000000
        purpose: "Working capital"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: ingest_first_email
    http:
      actor: "u_originator"
      method: POST
      path: /v1/email/ingest
      json:
        deal_id: "${deal_id}"
        raw_rfc822_base64: ""
    expect:
      status: 201
      save:
        comm_1_id: "$.communication_id"
        thread_id: "$.thread_id"

  - id: ingest_reply_email
    http:
      actor: "u_originator"
      method: POST
      path: /v1/email/ingest
      json:
        deal_id: "${deal_id}"
        raw_rfc822_base64: ""
    expect:
      status: 201
      json_contains:
        thread_id: "${thread_id}"
      save:
        comm_2_id: "$.communication_id"

  - id: verify_thread
    http:
      actor: "u_originator"
      method: GET
      path: /v1/deals/${deal_id}/communications
    expect:
      status: 200
      json_path_assertions:
        - path: "$.communications.length"
          eq: 2
        - path: "$.communications[0].thread_id"
          eq: "${thread_id}"
        - path: "$.communications[1].thread_id"
          eq: "${thread_id}"

