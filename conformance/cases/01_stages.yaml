# ─── 3.4: broker cannot transition to closing ───────────────────────────────
---
test: role_broker_cannot_transition_to_closing
meta:
  name: "Broker role cannot transition a deal to closing"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }
      - { id: "u_originator", role: "originator" }
      - { id: "u_underwriter", role: "underwriter" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "RoleTest Delta"
        jurisdiction: "GB"
        requested_amount: 40000000
        purpose: "Acquisition"
        borrower_registration_number: "RT-004"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: to_origination
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "origination"
    expect:
      status: 200

  - id: upload_document
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals/${deal_id}/documents
      json:
        doc_type: "accounts"
        filename: "accounts.csv"
        content_base64: "cmV2ZW51ZSxjb3N0X29mX2dvb2RzLG5ldF9pbmNvbWUKMTAwMDAwMCw2MDAwMDAsNDAwMDAw"
    expect:
      status: 202

  - id: set_proceed
    http:
      actor: "u_originator"
      method: PATCH
      path: /v1/deals/${deal_id}
      json:
        origination_outcome: "proceed"
    expect:
      status: 200


  - id: create_spread
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals/${deal_id}/spread
      json:
        entity_id: "e_placeholder"
        period: "FY2024"
        line_items:
          - { category: "revenue", label: "Revenue", amount: 1000000 }
          - { category: "cogs", label: "COGS", amount: 600000 }
          - { category: "operating_expense", label: "OpEx", amount: 200000 }
    expect:
      status: 200
  - id: to_underwriting
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "underwriting"
    expect:
      status: 200

  - id: broker_tries_closing
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "closing"
    expect:
      status: 403
      json_schema: "schemas/error.schema.json"
      json_contains:
        error:
          code: "FORBIDDEN"

  - id: verify_unchanged
    http:
      actor: "u_underwriter"
      method: GET
      path: /v1/deals/${deal_id}
    expect:
      status: 200
      json_contains:
        stage: "underwriting"

