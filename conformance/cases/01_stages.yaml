# 3. ROLE-BASED PERMISSIONS
# =============================================================================

# ─── 3.1: originator can move to origination ────────────────────────────────
---
test: role_originator_can_transition_to_origination
meta:
  name: "Originator role is permitted to move deal to origination"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }
      - { id: "u_originator", role: "originator" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "RoleTest Alpha"
        jurisdiction: "GB"
        requested_amount: 10000000
        purpose: "Working capital"
        borrower_registration_number: "RT-001"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: originator_transitions
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "origination"
    expect:
      status: 200
      json_contains:
        to_stage: "origination"

