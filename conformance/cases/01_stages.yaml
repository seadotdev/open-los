# =============================================================================
# 2. INVALID TRANSITIONS
# =============================================================================

# ─── 2.1: skip stage (broker → underwriting) ────────────────────────────────
---
test: invalid_skip_stage_broker_to_underwriting
meta:
  name: "Cannot skip stages: broker to underwriting is rejected"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }
      - { id: "u_underwriter", role: "underwriter" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "SkipCo"
        jurisdiction: "GB"
        requested_amount: 10000000
        purpose: "Working capital"
        borrower_registration_number: "SK-001"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: skip_to_underwriting
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "underwriting"
    expect:
      status: 409
      json_schema: "schemas/error.schema.json"
      json_contains:
        error:
          code: "INVALID_TRANSITION"

  - id: verify_unchanged
    http:
      actor: "u_broker"
      method: GET
      path: /v1/deals/${deal_id}
    expect:
      status: 200
      json_contains:
        stage: "broker"

