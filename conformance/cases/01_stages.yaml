version: "0.1.0"
suite: stages
description: >
  Full stage machine conformance: all 5 stages, valid/invalid transitions,
  roles, outcomes, overrides, checklists.

# =============================================================================
# 1. VALID FORWARD TRANSITIONS
# =============================================================================

# ─── 1.1: broker → origination ──────────────────────────────────────────────
---
test: valid_broker_to_origination
meta:
  name: "Valid transition from broker to origination"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }
      - { id: "u_originator", role: "originator" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Acme Ltd"
        jurisdiction: "GB"
        requested_amount: 25000000
        purpose: "Working capital"
        borrower_registration_number: "12345678"
    expect:
      status: 201
      json_schema: "schemas/deal.schema.json"
      json_contains:
        stage: "broker"
      save:
        deal_id: "$.id"

  - id: transition_to_origination
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "origination"
    expect:
      status: 200
      json_schema: "schemas/stage-transition.schema.json"
      json_contains:
        from_stage: "broker"
        to_stage: "origination"

  - id: verify_stage
    http:
      actor: "u_originator"
      method: GET
      path: /v1/deals/${deal_id}
    expect:
      status: 200
      json_contains:
        stage: "origination"

# ─── 1.2: origination → underwriting ────────────────────────────────────────
---
test: valid_origination_to_underwriting
meta:
  name: "Valid transition from origination to underwriting with proceed outcome"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_broker", role: "broker" }
      - { id: "u_originator", role: "originator" }
      - { id: "u_underwriter", role: "underwriter" }

steps:
  - id: create_deal
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Beta Corp"
        jurisdiction: "GB"
        requested_amount: 50000000
        purpose: "Acquisition finance"
        borrower_registration_number: "87654321"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: transition_to_origination
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "origination"
    expect:
      status: 200

  - id: upload_document
    http:
      actor: "u_broker"
      method: POST
      path: /v1/deals/${deal_id}/documents
      json:
        doc_type: "accounts"
        filename: "accounts_2025.csv"
        content_base64: "cmV2ZW51ZSxjb3N0X29mX2dvb2RzLG5ldF9pbmNvbWUKMTAwMDAwMCw2MDAwMDAsNDAwMDAw"
    expect:
      status: 202

  - id: set_outcome_proceed
    http:
      actor: "u_originator"
      method: PATCH
      path: /v1/deals/${deal_id}
      json:
        origination_outcome: "proceed"
    expect:
      status: 200
      json_contains:
        origination_outcome: "proceed"


  - id: create_spread
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals/${deal_id}/spread
      json:
        entity_id: "e_placeholder"
        period: "FY2024"
        line_items:
          - { category: "revenue", label: "Revenue", amount: 1000000 }
          - { category: "cogs", label: "COGS", amount: 600000 }
          - { category: "operating_expense", label: "OpEx", amount: 200000 }
    expect:
      status: 200
  - id: transition_to_underwriting
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "underwriting"
    expect:
      status: 200
      json_schema: "schemas/stage-transition.schema.json"
      json_contains:
        from_stage: "origination"
        to_stage: "underwriting"

  - id: verify_stage
    http:
      actor: "u_underwriter"
      method: GET
      path: /v1/deals/${deal_id}
    expect:
      status: 200
      json_contains:
        stage: "underwriting"

