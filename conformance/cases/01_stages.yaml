  - id: to_origination
    http:
      actor: "u_originator"
      method: POST
      path: /v1/deals/${deal_id}/stage-transitions
      json:
        to_stage: "origination"
    expect:
      status: 200

  - id: set_reject
    http:
      actor: "u_originator"
      method: PATCH
      path: /v1/deals/${deal_id}
      json:
        origination_outcome: "reject"
    expect:
