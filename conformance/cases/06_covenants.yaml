version: "0.1.0"
suite: covenants
description: >
  Typed covenants engine: creation, type variants, test execution (pass/fail),
  grace periods, waivers, validation, and audit trail.

# ─── 1. Create covenants ──────────────────────────────────────────────────────

# ─── Test 1: Create a financial covenant ──────────────────────────────────────
---
test: cov_create_financial
meta:
  name: "Create a DSCR financial covenant on a deal"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_underwriter", role: "underwriter" }

steps:
  - id: create_deal
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Acme Ltd"
        jurisdiction: "GB"
        requested_amount: 25000000
        purpose: "Working capital"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: create_covenant
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals/${deal_id}/covenants
      json:
        name: "Minimum DSCR"
        type: "financial"
        metric: "dscr"
        operator: ">="
        threshold: 1.2
        frequency: "quarterly"
    expect:
      status: 201
      json_schema: "schemas/covenant.schema.json"
      json_contains:
        deal_id: "${deal_id}"
        name: "Minimum DSCR"
        type: "financial"
        metric: "dscr"
        operator: ">="
        threshold: 1.2
        frequency: "quarterly"
      save:
        covenant_id: "$.id"

