# ─── 3. Covenant test execution - pass ────────────────────────────────────────

# ─── Test 6: DSCR test passes with good ratio ────────────────────────────────
---
test: cov_test_pass_dscr
meta:
  name: "DSCR covenant test passes when actual 2.5 >= threshold 1.2"
  now: "2026-01-15T10:00:00Z"

arrange:
  reset_db: true
  seed:
    tenant: { id: "t1" }
    users:
      - { id: "u_underwriter", role: "underwriter" }

steps:
  - id: create_deal
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals
      json:
        borrower_name: "Acme Ltd"
        jurisdiction: "GB"
        requested_amount: 25000000
        purpose: "Working capital"
    expect:
      status: 201
      save:
        deal_id: "$.id"

  - id: upload_spread
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals/${deal_id}/spread
      json:
        period: "2025-Q4"
        metrics:
          revenue: 10000000
          ebitda: 5000000
          net_income: 3000000
          total_debt: 8000000
          total_equity: 12000000
          current_assets: 7000000
          current_liabilities: 3500000
          debt_service: 2000000
          cash_and_equivalents: 6000000
    expect:
      status: 201
      save:
        spread_id: "$.id"

  - id: create_dscr_covenant
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals/${deal_id}/covenants
      json:
        name: "Minimum DSCR"
        type: "financial"
        metric: "dscr"
        operator: ">="
        threshold: 1.2
        frequency: "quarterly"
    expect:
      status: 201
      save:
        covenant_id: "$.id"

  - id: test_covenants
    http:
      actor: "u_underwriter"
      method: POST
      path: /v1/deals/${deal_id}/covenants/test
      json:
        as_of_period: "2025-Q4"
    expect:
      status: 200
      json_schema: "schemas/covenant-test.schema.json"
      json_path_assertions:
        - path: "$.results.length"
          eq: 1
        - path: "$.results[0].covenant_id"
          eq: "${covenant_id}"
        - path: "$.results[0].status"
          eq: "pass"
        - path: "$.results[0].actual_value"
          eq: 2.5
        - path: "$.results[0].threshold"
          eq: 1.2

